<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Jojo Tofu Survivor - Elite AI Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'MS Gothic', sans-serif; }
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        #area-ui { position: absolute; top: 10px; right: 10px; color: #f0f; background: rgba(0,0,0,0.8); padding: 10px; border: 2px solid #f0f; border-radius: 5px; font-weight: bold; text-align: right; }
        #status-ui { position: absolute; bottom: 20px; left: 20px; color: #fff; text-shadow: 2px 2px #000; }
        .bar-container { width: 220px; height: 14px; background: #333; border: 2px solid #fff; margin-bottom: 8px; }
        #hp-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }
        #sh-fill { width: 0%; height: 100%; background: #0cf; transition: width 0.1s; }
        #timestop-label { color: #ff0; font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        #warning { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); color: #ff0000; font-size: 40px; font-weight: bold; display: none; text-shadow: 3px 3px #000; }
        #time-stop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: difference; background: white; display: none; z-index: 50; }
    </style>
</head>
<body>

    <div id="time-stop-overlay"></div>
    <div id="ui-container">
        <div id="warning">⚠️エリア外ダメージ⚠️</div>
        <div id="area-ui">SURVIVORS: <span id="survivors-count">--</span><br>RADIUS: <span id="area-radius">--</span></div>
        <div id="status-ui">
            <div id="timestop-label">TIME STOP: READY (E)</div>
            SHIELD <div class="bar-container"><div id="sh-fill"></div></div>
            HP <div class="bar-container"><div id="hp-fill"></div></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000011);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        const obstacles = [];
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshPhongMaterial({ color: 0x111111 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const colors = [0xff3333, 0x33ff33, 0x3333ff, 0xffff33, 0xff33ff, 0x33ffff, 0xffaa00];
        const gridSize = 40;
        for (let x = -240; x <= 240; x += gridSize) {
            for (let z = -240; z <= 240; z += gridSize) {
                if (Math.abs(x) < 25 && Math.abs(z) < 25) continue;
                const offsetX = (Math.random() - 0.5) * 30;
                const offsetZ = (Math.random() - 0.5) * 30;
                const w = 14, h = Math.random() * 50 + 15, d = 14;
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshPhongMaterial({ color: colors[Math.floor(Math.random() * colors.length)] }));
                mesh.position.set(x + offsetX, h / 2, z + offsetZ);
                scene.add(mesh);
                obstacles.push({ minX: mesh.position.x - w/2 - 1, maxX: mesh.position.x + w/2 + 1, minZ: mesh.position.z - d/2 - 1, maxZ: mesh.position.z + d/2 + 1 });
            }
        }

        const areaWallGeom = new THREE.CylinderGeometry(1, 1, 400, 64, 1, true);
        const areaWallMat = new THREE.MeshBasicMaterial({ color: 0xaa00ff, side: THREE.BackSide, transparent: true, opacity: 0.35 });
        const areaWall = new THREE.Mesh(areaWallGeom, areaWallMat);
        areaWall.position.y = 200;
        scene.add(areaWall);

        let areaRadius = 220, timeElapsed = 0;
        const player = new THREE.Group();
        scene.add(player);
        const playerBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        playerBody.position.y = 0.6;
        player.add(playerBody);
        player.add(camera);
        camera.position.set(0, 7, 12);
        camera.lookAt(0, 1, -5);

        const stand = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x660000 }));
        stand.position.set(0, 0.7, -2.8);
        stand.visible = false;
        player.add(stand);

        let playerHP = 100, playerSH = 0, isTimeStopped = false, timeStopCooldown = 0;

        const items = [];
        function spawnItem(x, z) {
            const isShield = Math.random() > 0.4;
            const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.7), new THREE.MeshPhongMaterial({ color: isShield ? 0x00ccff : 0x00ff00 }));
            mesh.position.set(x, 0.8, z);
            scene.add(mesh);
            items.push({ mesh, type: isShield ? 'SH' : 'HP' });
        }

        const enemies = [];
        function spawnEnemy() {
            const angle = Math.random() * Math.PI * 2;
            const dist = 80 + Math.random() * 100;
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.3, 1.3), new THREE.MeshPhongMaterial({ color: 0xbbbb00 }));
            body.position.y = 0.65;
            group.add(body);
            const eStand = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshPhongMaterial({ color: 0xff1111 }));
            eStand.visible = false;
            scene.add(eStand);
            group.position.set(Math.cos(angle)*dist, 0, Math.sin(angle)*dist);
            scene.add(group);
            // 強化：HPアップ
            enemies.push({ mesh: group, stand: eStand, alive: true, hp: 120, attackCooldown: 0, hateTimer: 0, pendingDeath: false });
        }
        for(let i=0; i<40; i++) spawnEnemy();

        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyE' && timeStopCooldown <= 0 && !isTimeStopped) {
                isTimeStopped = true;
                document.getElementById('time-stop-overlay').style.display = 'block';
                setTimeout(() => { 
                    isTimeStopped = false; timeStopCooldown = 18; document.getElementById('time-stop-overlay').style.display = 'none';
                    enemies.forEach(e => { if(e.pendingDeath) { 
                        if(Math.random() < 0.4) spawnItem(e.mesh.position.x, e.mesh.position.z);
                        e.alive = false; scene.remove(e.mesh); scene.remove(e.stand); 
                    }});
                }, 5000);
            }
        });
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        function checkCollision(nX, nZ) {
            for (let obs of obstacles) if (nX > obs.minX && nX < obs.maxX && nZ > obs.minZ && nZ < obs.maxZ) return true;
            return false;
        }

        let isAttacking = false;
        function attack() {
            if(isAttacking) return;
            isAttacking = true; stand.visible = true;
            const rush = setInterval(() => {
                stand.position.set((Math.random()-0.5)*1.2, 0.7+(Math.random()-0.5)*1.2, -2.8 - (Math.random()*1.2));
                const standPos = new THREE.Vector3();
                stand.getWorldPosition(standPos);
                enemies.forEach(e => { 
                    if(e.alive && !e.pendingDeath && standPos.distanceTo(e.mesh.position) < 5.0) { 
                        e.hp -= 4; e.hateTimer = 12;
                        if(e.hp <= 0 && isTimeStopped) e.pendingDeath = true;
                    } 
                });
            }, 30);
            setTimeout(() => { clearInterval(rush); stand.visible = false; isAttacking = false; stand.position.set(0, 0.7, -2.8); }, 450);
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            
            if (!isTimeStopped) {
                timeElapsed += delta;
                if (areaRadius > 8) areaRadius -= delta * 1.5;
                areaWall.scale.set(areaRadius, 1, areaRadius);
                if (timeStopCooldown > 0) {
                    timeStopCooldown -= delta;
                    document.getElementById('timestop-label').innerText = `TS COOLDOWN: ${Math.ceil(timeStopCooldown)}s`;
                } else { document.getElementById('timestop-label').innerText = "TIME STOP: READY (E)"; }
            }

            const currentDmg = 12 * (1.5 + (timeElapsed / 50));
            document.getElementById('area-radius').innerText = Math.floor(areaRadius);

            const distP = Math.sqrt(player.position.x**2 + player.position.z**2);
            if (distP > areaRadius) {
                playerHP -= currentDmg * delta;
                document.getElementById('warning').style.display = 'block';
            } else { document.getElementById('warning').style.display = 'none'; }

            const speedMultiplier = isTimeStopped ? 1.6 : 1.0;
            if (keys['ArrowLeft']) player.rotation.y += 3.2 * delta;
            if (keys['ArrowRight']) player.rotation.y -= 3.2 * delta;
            const moveSpeed = 20 * delta * speedMultiplier, angle = player.rotation.y;
            const dirZ = (keys['KeyW'] ? -1 : 0) + (keys['KeyS'] ? 1 : 0);
            const dirX = (keys['KeyA'] ? -1 : 0) + (keys['KeyD'] ? 1 : 0);
            if (dirZ !== 0 || dirX !== 0) {
                let nX = player.position.x + (Math.sin(angle)*dirZ + Math.cos(angle)*dirX)*moveSpeed;
                let nZ = player.position.z + (Math.cos(angle)*dirZ - Math.sin(angle)*dirX)*moveSpeed;
                if (!checkCollision(nX, player.position.z)) player.position.x = nX;
                if (!checkCollision(player.position.x, nZ)) player.position.z = nZ;
            }
            if (keys['Space']) attack();

            items.forEach((it, idx) => {
                it.mesh.rotation.y += delta * 3;
                if (it.mesh.position.distanceTo(player.position) < 2.5) {
                    if (it.type === 'HP') playerHP = Math.min(100, playerHP + 35);
                    else playerSH = Math.min(100, playerSH + 55);
                    scene.remove(it.mesh);
                    items.splice(idx, 1);
                }
            });

            let aliveCount = 1;
            enemies.forEach(e => {
                if(!e.alive) return;
                if(!e.pendingDeath) aliveCount++;
                if (!isTimeStopped && e.hp <= 0) { 
                    if(Math.random() < 0.35) spawnItem(e.mesh.position.x, e.mesh.position.z);
                    e.alive = false; scene.remove(e.mesh); scene.remove(e.stand); return; 
                }
                if (isTimeStopped) { if (e.pendingDeath) e.mesh.children[0].material.color.set(0x333333); return; }

                const dCenter = Math.sqrt(e.mesh.position.x**2 + e.mesh.position.z**2);
                const dP = e.mesh.position.distanceTo(player.position);
                if (dCenter > areaRadius) e.hp -= currentDmg * delta;

                // --- 敵AIの優先順位変更：生存本能 ---
                let targetPos = null;
                let isFleeing = false;

                // エリアの端（85%地点）にいたら、戦闘をやめて中央へ向かう
                if (dCenter > areaRadius * 0.85) {
                    targetPos = new THREE.Vector3(0, 0, 0);
                    isFleeing = true;
                } else {
                    let targetObj = (e.hateTimer > 0 || dP < 40) ? player : null;
                    if (!targetObj) enemies.forEach(o => { if (o !== e && o.alive && e.mesh.position.distanceTo(o.mesh.position) < 30) targetObj = o.mesh; });
                    if (targetObj) targetPos = targetObj.position;
                }

                if (targetPos) {
                    e.mesh.lookAt(targetPos.x, 0, targetPos.z);
                    const tDist = e.mesh.position.distanceTo(targetPos);
                    
                    // 強化：敵の移動速度アップ(9->11)
                    const enemyMoveSpeed = isFleeing ? 13 * delta : 11 * delta;

                    if (isFleeing || tDist > 6.0) {
                        const moveAngle = e.mesh.rotation.y;
                        let sX = Math.sin(moveAngle) * enemyMoveSpeed, sZ = Math.cos(moveAngle) * enemyMoveSpeed;
                        if (checkCollision(e.mesh.position.x + sX, e.mesh.position.z + sZ)) {
                            const tryAngles = [Math.PI/3, -Math.PI/3, Math.PI/2, -Math.PI/2];
                            for(let ta of tryAngles) {
                                let asX = Math.sin(moveAngle + ta) * enemyMoveSpeed, asZ = Math.cos(moveAngle + ta) * enemyMoveSpeed;
                                if (!checkCollision(e.mesh.position.x + asX, e.mesh.position.z + asZ)) {
                                    e.mesh.position.x += asX; e.mesh.position.z += asZ; break;
                                }
                            }
                        } else { e.mesh.position.x += sX; e.mesh.position.z += sZ; }
                    } else if (e.attackCooldown <= 0 && !isFleeing) {
                        // 強化：攻撃間隔短縮 (1.6 -> 1.2)
                        e.attackCooldown = 1.2;
                        e.stand.visible = true;
                        let count = 0;
                        const eRush = setInterval(() => {
                            if (!e.alive || isTimeStopped || count > 15) { clearInterval(eRush); e.stand.visible = false; return; }
                            const dir = new THREE.Vector3().subVectors(targetPos, e.mesh.position).normalize();
                            e.stand.position.copy(e.mesh.position).add(dir.multiplyScalar(tDist * 0.85 + Math.random()));
                            e.stand.position.y = 1.0 + (Math.random()-0.5);
                            e.stand.lookAt(targetPos);
                            count++;
                        }, 30); // 強化：ラッシュ速度アップ
                        if (targetPos === player.position) { if (playerSH > 0) playerSH -= 12; else playerHP -= 12; }
                    }
                }
                if (e.attackCooldown > 0) e.attackCooldown -= delta;
                if (e.hateTimer > 0) e.hateTimer -= delta;
            });

            document.getElementById('survivors-count').innerText = aliveCount;
            document.getElementById('hp-fill').style.width = Math.max(0, playerHP) + "%";
            document.getElementById('sh-fill').style.width = Math.max(0, playerSH) + "%";
            if(playerHP <= 0) { alert("RETIRED!"); location.reload(); }
            if(aliveCount === 1 && playerHP > 0) { alert("VICTORY!"); location.reload(); }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
