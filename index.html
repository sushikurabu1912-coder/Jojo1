<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Jojo Tofu Survivor - Stable Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'MS Gothic', sans-serif; }
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; }
        #area-ui { position: absolute; top: 10px; right: 10px; color: #f0f; background: rgba(0,0,0,0.8); padding: 10px; border: 2px solid #f0f; border-radius: 5px; font-weight: bold; text-align: right; }
        #status-ui { position: absolute; bottom: 20px; left: 20px; color: #fff; text-shadow: 2px 2px #000; }
        .bar-container { width: 220px; height: 14px; background: #333; border: 2px solid #fff; margin-bottom: 8px; }
        #hp-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }
        #sh-fill { width: 0%; height: 100%; background: #0cf; transition: width 0.1s; }
        #timestop-label { color: #ff0; font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        #attack-label { color: #f00; font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        #warning { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); color: #ff0000; font-size: 40px; font-weight: bold; display: none; text-shadow: 3px 3px #000; }
        #time-stop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: difference; background: white; display: none; z-index: 50; }
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; }
        #start-btn { padding: 20px 40px; font-size: 24px; color: white; background: #0088ff; border: none; cursor: pointer; border-radius: 10px; font-weight: bold; }
        #start-btn:hover { background: #00ccff; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="color: #ff0; text-shadow: 2px 2px #f00;">TOFU SURVIVOR</h1>
        <p>Eキー: 時停止 / SPACE: 攻撃 / 矢印・WASD: 移動</p>
        <button id="start-btn">GAME START</button>
    </div>

    <div id="time-stop-overlay"></div>
    <div id="ui-container">
        <div id="warning">⚠️エリア外ダメージ⚠️</div>
        <div id="area-ui">SURVIVORS: <span id="survivors-count">--</span><br>RADIUS: <span id="area-radius">--</span></div>
        <div id="status-ui">
            <div id="attack-label">ATTACK: READY (SPACE)</div>
            <div id="timestop-label">TIME STOP: READY (E)</div>
            SHIELD <div class="bar-container"><div id="sh-fill"></div></div>
            HP <div class="bar-container"><div id="hp-fill"></div></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        // --- 音声の初期設定 ---
        const stopSound = new Audio('nc169548_時を止める音.mp3');    
        const resumeSound = new Audio('nc173586_「ジョジョ」時が動き出す音.mp3'); 
        let isGameStarted = false;

        function safePlay(audio) {
            audio.currentTime = 0;
            audio.play().catch(() => console.log("Audio play failed (file might be missing)"));
        }

        // --- 3D基本設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000011);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ライト
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        // 障害物（ビル）生成
        const obstacles = [];
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshPhongMaterial({ color: 0x111111 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const colors = [0xff3333, 0x33ff33, 0x3333ff, 0xffff33, 0xff33ff, 0x33ffff, 0xffaa00];
        for (let x = -240; x <= 240; x += 40) {
            for (let z = -240; z <= 240; z += 40) {
                if (Math.abs(x) < 25 && Math.abs(z) < 25) continue;
                const w = 14, h = Math.random() * 50 + 15, d = 14;
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshPhongMaterial({ color: colors[Math.floor(Math.random() * colors.length)] }));
                mesh.position.set(x + (Math.random()-0.5)*30, h/2, z + (Math.random()-0.5)*30);
                scene.add(mesh);
                obstacles.push({ minX: mesh.position.x - w/2, maxX: mesh.position.x + w/2, minZ: mesh.position.z - d/2, maxZ: mesh.position.z + d/2 });
            }
        }

        // プレイヤー設定
        const player = new THREE.Group();
        const playerBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        playerBody.position.y = 0.6;
        player.add(playerBody);
        scene.add(player);
        player.add(camera);
        camera.position.set(0, 7, 12);
        camera.lookAt(0, 1, -5);

        const stand = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 1.4), new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x660000 }));
        stand.position.set(0, 0.7, -2.8);
        stand.visible = false;
        player.add(stand);

        // ゲーム状態
        let playerHP = 100, playerSH = 0, isTimeStopped = false, timeStopCooldown = 0, playerAttackCooldown = 0, areaRadius = 220;
        const enemies = [];
        const keys = {};

        function checkCollision(nX, nZ) {
            for (let obs of obstacles) {
                if (nX > obs.minX - 1.2 && nX < obs.maxX + 1.2 && nZ > obs.minZ - 1.2 && nZ < obs.maxZ + 1.2) return true;
            }
            return false;
        }

        // 敵スポーン
        function spawnEnemy() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.3, 1.3), new THREE.MeshPhongMaterial({ color: 0xbbbb00 }));
            body.position.y = 0.65;
            group.add(body);
            const angle = Math.random() * Math.PI * 2;
            group.position.set(Math.cos(angle)*150, 0, Math.sin(angle)*150);
            scene.add(group);
            enemies.push({ mesh: group, alive: true, hp: 120 });
        }
        for(let i=0; i<30; i++) spawnEnemy();

        // --- イベントリスナー ---
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyE' && timeStopCooldown <= 0 && !isTimeStopped && isGameStarted) {
                isTimeStopped = true;
                safePlay(stopSound);
                document.getElementById('time-stop-overlay').style.display = 'block';
                setTimeout(() => { 
                    isTimeStopped = false;
                    safePlay(resumeSound);
                    timeStopCooldown = 15; 
                    document.getElementById('time-stop-overlay').style.display = 'none';
                }, 5000);
            }
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // スタートボタンクリック
        document.getElementById('start-btn').onclick = () => {
            isGameStarted = true;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block';
            // 空の再生でAudioContextを有効化
            stopSound.play().catch(()=>{});
        };

        // --- ループ処理 ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            if (!isGameStarted) {
                renderer.render(scene, camera);
                return;
            }

            const delta = Math.min(clock.getDelta(), 0.1);

            // 時が止まっていない時の処理
            if (!isTimeStopped) {
                if (areaRadius > 10) areaRadius -= delta * 1.0;
                if (timeStopCooldown > 0) timeStopCooldown -= delta;
            }

            // 移動
            if (keys['ArrowLeft'] || keys['KeyA']) player.rotation.y += 3 * delta;
            if (keys['ArrowRight'] || keys['KeyD']) player.rotation.y -= 3 * delta;
            const mS = 18 * delta;
            const pRot = player.rotation.y;
            if (keys['KeyW'] || keys['ArrowUp']) {
                let nX = player.position.x - Math.sin(pRot) * mS;
                let nZ = player.position.z - Math.cos(pRot) * mS;
                if (!checkCollision(nX, nZ)) { player.position.x = nX; player.position.z = nZ; }
            }
            if (keys['KeyS'] || keys['ArrowDown']) {
                let nX = player.position.x + Math.sin(pRot) * mS;
                let nZ = player.position.z + Math.cos(pRot) * mS;
                if (!checkCollision(nX, nZ)) { player.position.x = nX; player.position.z = nZ; }
            }

            // UI更新
            document.getElementById('hp-fill').style.width = playerHP + "%";
            document.getElementById('area-radius').innerText = Math.floor(areaRadius);
            document.getElementById('survivors-count').innerText = enemies.filter(e => e.alive).length + 1;

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
