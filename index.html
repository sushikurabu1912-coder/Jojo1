<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Jojo Tofu Survivor - Collision Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'MS Gothic', sans-serif; }
        #ui { position: absolute; bottom: 20px; left: 20px; color: #fff; text-shadow: 2px 2px #000; font-size: 28px; font-weight: bold; pointer-events: none; }
        #instructions { position: absolute; top: 10px; left: 10px; color: #000; background: rgba(255,255,255,0.8); padding: 15px; border: 2px solid #333; border-radius: 10px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="instructions">
        WASD：移動 / 矢印キー：視点操作<br>
        <b>スペースキー：スタンドラッシュ</b>
    </div>
    <div id="ui">BRIGHT DISTRICT</div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        // --- 基本設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // 爽やかな青空
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- ライティング（大幅に明るく） ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2); // 環境光を強く
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5); // 太陽光
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        // --- ステージ生成と当たり判定データ ---
        const obstacles = []; // 当たり判定用の配列
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshPhongMaterial({ color: 0x999999 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        function createBuilding(x, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshPhongMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h / 2, z);
            scene.add(mesh);

            // 当たり判定用のデータを保存（AABB方式）
            obstacles.push({
                minX: x - w/2, maxX: x + w/2,
                minZ: z - d/2, maxZ: z + d/2
            });
        }

        // マップ生成
        const colors = [0xdd5555, 0x55dd55, 0x5555dd, 0xeeee55];
        for (let i = 0; i < 50; i++) {
            const x = Math.random() * 200 - 100;
            const z = Math.random() * 200 - 100;
            if (Math.abs(x) < 15 && Math.abs(z) < 15) continue;

            const w = Math.random() * 6 + 4;
            const h = Math.random() * 20 + 5;
            const d = Math.random() * 6 + 4;
            createBuilding(x, z, w, h, d, colors[i % colors.length]);
        }

        // 外周の壁
        createBuilding(0, 150, 300, 20, 5, 0x333333);
        createBuilding(0, -150, 300, 20, 5, 0x333333);
        createBuilding(150, 0, 5, 20, 300, 0x333333);
        createBuilding(-150, 0, 5, 20, 300, 0x333333);

        // --- プレイヤー ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);
        const playerBody = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        playerBody.position.y = 0.5;
        playerGroup.add(playerBody);

        const cameraOffset = new THREE.Vector3(0, 3, 6); 
        playerGroup.add(camera);
        camera.position.copy(cameraOffset);
        camera.lookAt(new THREE.Vector3(0, 1, -5));

        const stand = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshPhongMaterial({ color: 0xff0000 }));
        stand.position.set(0, 0.6, -2.5);
        stand.visible = false;
        playerGroup.add(stand);

        // --- 入力と衝突判定ロジック ---
        const keys = {};
        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        function checkCollision(newX, newZ) {
            const pSize = 0.5; // プレイヤーの半径
            for (let obs of obstacles) {
                if (newX + pSize > obs.minX && newX - pSize < obs.maxX &&
                    newZ + pSize > obs.minZ && newZ - pSize < obs.maxZ) {
                    return true; // 衝突！
                }
            }
            return false;
        }

        let isAttacking = false;
        function attack() {
            if(isAttacking) return;
            isAttacking = true;
            stand.visible = true;
            const rushEffect = setInterval(() => {
                stand.position.x = (Math.random() - 0.5) * 0.8;
                stand.position.y = 0.6 + (Math.random() - 0.5) * 0.5;
            }, 30);
            setTimeout(() => {
                clearInterval(rushEffect);
                stand.visible = false;
                stand.position.set(0, 0.6, -2.5);
                isAttacking = false;
            }, 350);
        }

        // --- ループ ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (keys['ArrowLeft']) playerGroup.rotation.y += 2.5 * delta;
            if (keys['ArrowRight']) playerGroup.rotation.y -= 2.5 * delta;

            const moveSpeed = 15 * delta;
            // 次の移動予定位置を計算
            let nextX = playerGroup.position.x;
            let nextZ = playerGroup.position.z;

            // 簡易的な移動ベクトル計算
            const dirZ = (keys['KeyW'] ? -1 : 0) + (keys['KeyS'] ? 1 : 0);
            const dirX = (keys['KeyA'] ? -1 : 0) + (keys['KeyD'] ? 1 : 0);

            if (dirZ !== 0 || dirX !== 0) {
                // 向いている方向に基づいて移動量を算出
                const angle = playerGroup.rotation.y;
                const localZ = dirZ * moveSpeed;
                const localX = dirX * moveSpeed;
                
                nextX += Math.sin(angle) * localZ + Math.cos(angle) * localX;
                nextZ += Math.cos(angle) * localZ - Math.sin(angle) * localX;

                // 衝突判定：移動先が壁でなければ移動を許可
                if (!checkCollision(nextX, playerGroup.position.z)) playerGroup.position.x = nextX;
                if (!checkCollision(playerGroup.position.x, nextZ)) playerGroup.position.z = nextZ;
            }

            if (keys['Space']) attack();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
