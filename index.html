<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Jojo Tofu Survivor - Custom Sound</title>
    <style>
        /* スタイルは前回と同じ */
        body { margin: 0; overflow: hidden; background: #000; font-family: 'MS Gothic', sans-serif; }
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
        #time-stop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: difference; background: white; display: none; z-index: 50; }
        #start-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; background: rgba(0,0,0,0.8); padding: 20px; border: 2px solid #fff; z-index: 100; text-align: center; cursor: pointer; }
    </style>
</head>
<body>

    <div id="start-msg">CLICK TO LOAD SOUNDS & START</div>
    <div id="time-stop-overlay"></div>
    <!-- UI要素などは省略せずに維持してください -->

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        // --- カスタム音声の設定 ---
        const stopSound = new Audio('nc169548_時を止める音.mp3');    // ここに時停止のファイル名
        const resumeSound = new Audio('nc173586_「ジョジョ」時が動き出す音.mp3'); // ここに再開のファイル名

        // 音量の調整 (0.0 ～ 1.0)
        stopSound.volume = 0.5;
        resumeSound.volume = 0.5;

        // ブラウザの制限解除のためのクリックイベント
        document.getElementById('start-msg').onclick = () => {
            // 一度再生して即停止することで、プログラムからの再生を許可させる
            stopSound.play().then(() => { stopSound.pause(); stopSound.currentTime = 0; });
            resumeSound.play().then(() => { resumeSound.pause(); resumeSound.currentTime = 0; });
            
            document.getElementById('start-msg').style.display = 'none';
        };

        // --- 既存のゲームロジック ---
        // (省略: 前回のコードの変数をそのまま使用)
        let isTimeStopped = false;
        let timeStopCooldown = 0;

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyE' && timeStopCooldown <= 0 && !isTimeStopped) {
                isTimeStopped = true;
                
                // 指定した音を再生
                stopSound.currentTime = 0; // 頭出し
                stopSound.play();

                document.getElementById('time-stop-overlay').style.display = 'block';

                setTimeout(() => { 
                    isTimeStopped = false;
                    
                    // 指定した音を再生
                    resumeSound.currentTime = 0;
                    resumeSound.play();

                    timeStopCooldown = 18; 
                    document.getElementById('time-stop-overlay').style.display = 'none';
                    // 敵の撃破処理など...
                }, 5000);
            }
        });

        // 以下のanimate関数やシーン構築は以前のコードをそのまま組み込んでください
    </script>
</body>
</html>
