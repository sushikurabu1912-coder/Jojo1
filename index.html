<script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        let isGameStarted = false, areaRadius = 350, isGameOver = false;
        let charStats = { speed: 22, attack: 40, color: 0xffffff, type: 'white' };
        let playerHP = 100, playerShield = 0;
        let isInvincible = false, isTimeStopped = false, isTimeSkipping = false;
        let skillCd = 0, collectedCards = 0, skillUses = 0;
        const entities = [], obstacles = [], items = [], particles = [], labels = [], keys = {};
        let pCameraShakeAmount = 0;
        const P_CAMERA_BASE_POS = new THREE.Vector3(0, 15, 20);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000005);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(50, 100, 50); scene.add(sun);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshPhongMaterial({ color: 0x111111 }));
        floor.rotation.x = -Math.PI / 2; scene.add(floor);

        const gridSize = 50, range = 450;
        for(let x = -range; x <= range; x += gridSize) {
            for(let z = -range; z <= range; z += gridSize) {
                if (Math.abs(x) < 30 && Math.abs(z) < 30) continue;
                const h = 15 + Math.random() * 45, w = 12 + Math.random() * 8;
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), new THREE.MeshPhongMaterial({ color: [0x555555, 0x333333, 0x444444][Math.floor(Math.random()*3)] }));
                mesh.position.set(x + (Math.random()-0.5)*30, h/2, z + (Math.random()-0.5)*30);
                scene.add(mesh);
                obstacles.push({ pos: new THREE.Vector2(mesh.position.x, mesh.position.z), radius: (w / 2) + 1.0 });
            }
        }

        function createParticle(pos, color) {
            const size = 0.2 + Math.random() * 0.3;
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), new THREE.MeshBasicMaterial({ color: color }));
            mesh.position.copy(pos);
            const vel = new THREE.Vector3((Math.random()-0.5)*0.5, (Math.random())*0.5, (Math.random()-0.5)*0.5);
            scene.add(mesh);
            particles.push({ mesh, vel, life: 1.0 });
        }

        function createDamageLabel(pos, amount) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 128; canvas.height = 64;
            ctx.fillStyle = '#ff0000';
            ctx.font = 'bold 40px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(Math.floor(amount), 64, 45);
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMaterial = new THREE.SpriteMaterial({ map: texture, transparent: true });
            const sprite = new THREE.Sprite(spriteMaterial);
            sprite.position.copy(pos);
            sprite.position.y += 2;
            sprite.scale.set(2, 1, 1);
            scene.add(sprite);
            labels.push({ sprite, life: 1.0 });
        }

        function triggerHitEffect(pos, amount, color = 0xff0000) {
            for(let i=0; i<8; i++) createParticle(pos, color);
            createDamageLabel(pos, amount);
        }

        function checkBuildingCollision(position, radius) {
            obstacles.forEach(o => {
                const dist = new THREE.Vector2(position.x, position.z).distanceTo(o.pos);
                if (dist < o.radius + radius) {
                    const pushDir = new THREE.Vector2(position.x, position.z).sub(o.pos).normalize();
                    const overlap = (o.radius + radius) - dist;
                    position.x += pushDir.x * overlap; position.z += pushDir.y * overlap;
                }
            });
        }

        const areaWall = new THREE.Mesh(new THREE.CylinderGeometry(areaRadius, areaRadius, 150, 64, 1, true), new THREE.MeshBasicMaterial({ color: 0x8800ff, transparent: true, opacity: 0.3, side: THREE.DoubleSide }));
        areaWall.position.y = 75; scene.add(areaWall);

        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        pBody.position.y = 0.75; player.add(pBody);
        const pStand = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xff0000, transparent: true, opacity: 0.6, emissive: 0x440000 }));
        pStand.visible = false; scene.add(pStand); 
        scene.add(player); player.add(camera);
        camera.position.copy(P_CAMERA_BASE_POS); camera.lookAt(0, 0, -5);

        function createEntity() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: [0xffff00, 0x00ffff, 0xff00ff, 0xff8800][Math.floor(Math.random()*4)] }));
            body.position.y = 0.75; group.add(body);
            const stand = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x660000 }));
            stand.visible = false; scene.add(stand);
            let tx, tz, spawned = false;
            while(!spawned) {
                const ang = Math.random()*Math.PI*2, dist = 60 + Math.random()*(areaRadius - 70);
                tx = Math.cos(ang)*dist; tz = Math.sin(ang)*dist;
                if (!obstacles.some(o => new THREE.Vector2(tx, tz).distanceTo(o.pos) < o.radius+4)) spawned = true;
            }
            group.position.set(tx, 0, tz); scene.add(group);
            return { group, stand, hp: 200, alive: true, id: Math.random(), attackCd: Math.random()*2, aiState: 'idle', target: null, killedByPlayer: false };
        }
        for(let i=0; i<99; i++) entities.push(createEntity());

        window.startGame = (type) => {
            if (type === 'white') charStats = { speed: 25, attack: 50, color: 0xffffff, type };
            if (type === 'cyan') charStats = { speed: 32, attack: 40, color: 0x00ffff, type };
            if (type === 'gold') charStats = { speed: 20, attack: 75, color: 0xffd700, type };
            pBody.material.color.setHex(charStats.color);
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block';
            isGameStarted = true;
        };

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        let pAttackCd = 0;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            if (!isGameStarted || isGameOver) return;

            const isEvolved = collectedCards >= 7;
            let maxUses = (charStats.type === 'cyan') ? (isEvolved ? 4 : 2) : (isEvolved ? 3 : 1);
            document.getElementById('skill-ui').innerText = `CARDS: ${collectedCards} / 3 | USES: ${skillUses}/${maxUses}`;

            const pSpeed = charStats.speed * delta;
            if (keys['ArrowLeft']) player.rotation.y += 3.6 * delta;
            if (keys['ArrowRight']) player.rotation.y -= 3.6 * delta;
            const mx = (keys['KeyD']?1:0) - (keys['KeyA']?1:0), mz = (keys['KeyS']?1:0) - (keys['KeyW']?1:0);
            if (mx !== 0 || mz !== 0) {
                const moveVec = new THREE.Vector3(mx, 0, mz).normalize().multiplyScalar(pSpeed).applyQuaternion(player.quaternion);
                player.position.add(moveVec);
            }
            checkBuildingCollision(player.position, 0.8);

            pAttackCd -= delta;
            if (keys['Space'] && pAttackCd <= 0) { 
                pAttackCd = 0.35; pStand.visible = true; pCameraShakeAmount = 0.5; setTimeout(() => pStand.visible = false, 150); 
                const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
                pStand.position.copy(player.position).add(fwd.multiplyScalar(2.8));
                pStand.position.y = 0.75;

                entities.forEach(e => {
                    if (e.alive && e.group.position.distanceTo(pStand.position) < 2.5) {
                        const dmg = charStats.attack;
                        e.hp -= dmg;
                        triggerHitEffect(e.group.position, dmg);
                        if (e.hp <= 0) {
                            e.killedByPlayer = true;
                            for(let i=0; i<15; i++) createParticle(e.group.position, 0xffff00);
                        }
                    }
                });
            }

            if (keys['KeyR'] && skillCd <= 0 && collectedCards >= 3 && skillUses < maxUses) {
                skillUses++; skillCd = 5.0;
                if (charStats.type === 'gold') { isTimeStopped = true; document.body.classList.add('time-stopped'); setTimeout(() => {isTimeStopped = false; document.body.classList.remove('time-stopped'); skillCd = 0;}, 3000); }
                if (charStats.type === 'white') { isInvincible = true; pBody.material.emissive.setHex(0xffffff); setTimeout(() => {isInvincible = false; pBody.material.emissive.setHex(0x000000); skillCd = 0;}, 5000); }
                if (charStats.type === 'cyan') { isTimeSkipping = true; document.getElementById('time-skip-overlay').style.display='block'; setTimeout(() => {isTimeSkipping=false; document.getElementById('time-skip-overlay').style.display='none'; skillCd=0;}, 4000); }
            }

            for(let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.mesh.position.add(p.vel);
                p.vel.y -= 0.02;
                p.life -= delta * 2;
                p.mesh.scale.setScalar(p.life);
                if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
            }
            for(let i = labels.length - 1; i >= 0; i--) {
                const l = labels[i];
                l.sprite.position.y += delta * 2;
                l.life -= delta;
                l.sprite.material.opacity = l.life;
                if (l.life <= 0) { scene.remove(l.sprite); labels.splice(i, 1); }
            }

            // --- BOTS AI & AREA SPEED ADJUSTED FOR 5 MINS ---
            const botDelta = isTimeStopped ? 0 : (isTimeSkipping ? delta * 0.2 : delta);
            // エリア縮小を大幅に減速 (0.8 -> 0.11)
            areaRadius -= botDelta * 0.11;
            areaWall.geometry.dispose(); areaWall.geometry = new THREE.CylinderGeometry(areaRadius, areaRadius, 150, 64, 1, true);

            entities.forEach(e => {
                if (!e.alive || isTimeStopped) { e.stand.visible = false; return; }
                let curTarget = isTimeSkipping ? null : player;
                let minDist = isTimeSkipping ? Infinity : e.group.position.distanceTo(player.position);
                
                entities.forEach(other => { if (other.alive && other.id !== e.id) { const d = e.group.position.distanceTo(other.group.position); if (d < minDist) { minDist = d; curTarget = other.group; } } });
                
                if (curTarget) {
                    const toVec = new THREE.Vector3().subVectors(curTarget.position, e.group.position).normalize();
                    // ボットの移動を減速 (12 -> 6) して接敵を遅らせる
                    e.group.position.add(toVec.multiplyScalar(6 * botDelta));
                    checkBuildingCollision(e.group.position, 0.8);

                    e.attackCd -= botDelta;
                    // ボットの攻撃間隔を延長 (2.0 -> 4.0) して生存率を上げる
                    if (minDist < 6.0 && e.attackCd <= 0) {
                        e.attackCd = 4.0; e.stand.visible = true;
                        setTimeout(() => e.stand.visible = false, 400);
                        const attackPos = new THREE.Vector3().copy(e.group.position).lerp(curTarget.position, 0.5);
                        e.stand.position.copy(attackPos); e.stand.position.y = 0.75;

                        if (e.stand.position.distanceTo(player.position) < 2.5 && !isInvincible && !isTimeSkipping) {
                            playerHP -= 10;
                            triggerHitEffect(player.position, 10);
                        }
                    }
                }
                if (e.group.position.length() > areaRadius) e.hp -= botDelta * 50;
                if (e.hp <= 0) { e.alive = false; scene.remove(e.group); scene.remove(e.stand); }
            });

            if (player.position.length() > areaRadius) playerHP -= delta * 30;
            const survivorCount = entities.filter(e => e.alive).length + 1;
            document.getElementById('hp-fill').style.width = Math.max(0, playerHP) + "%";
            document.getElementById('survivors-count').innerText = survivorCount;

            if (playerHP <= 0 && !isGameOver) {
                isGameOver = true; document.getElementById('final-rank').innerText = survivorCount; document.getElementById('gameover-screen').style.display = 'flex';
            }
            if (survivorCount === 1 && playerHP > 0) {
                isGameOver = true; document.getElementById('victory-message').style.display = 'block';
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
