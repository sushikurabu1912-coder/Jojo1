<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Jojo Tofu Survivor - Battle Royale</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'MS Gothic', sans-serif; }
        #ui { position: absolute; bottom: 20px; left: 20px; color: #fff; text-shadow: 2px 2px #000; font-size: 20px; font-weight: bold; pointer-events: none; }
        .bar-container { width: 200px; height: 12px; background: #333; border: 2px solid #fff; margin-top: 5px; }
        #hp-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }
        #sh-fill { width: 0%; height: 100%; background: #0cf; transition: width 0.1s; }
        #area-ui { position: absolute; top: 10px; right: 10px; color: #f0f; background: rgba(0,0,0,0.7); padding: 10px; border: 2px solid #f0f; border-radius: 5px; font-weight: bold; text-align: center; }
        #instructions { position: absolute; top: 10px; left: 10px; color: #000; background: rgba(255,255,255,0.8); padding: 10px; border: 2px solid #333; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <div id="instructions">WASD:移動 / 矢印:視点 / Space:攻撃<br>エリア外はダメージを受けるぞ！</div>
    <div id="area-ui">AREA SHRINKING<br><span id="area-radius">RADIUS: 150</span></div>
    <div id="ui">
        SHIELD <div class="bar-container"><div id="sh-fill"></div></div>
        HP <div class="bar-container"><div id="hp-fill"></div></div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        // --- 基本設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        // --- マップ設定 ---
        const obstacles = [];
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshPhongMaterial({ color: 0x666666 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        function createBuilding(x, z, w, h, d) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshPhongMaterial({ color: 0x444444 }));
            mesh.position.set(x, h/2, z);
            scene.add(mesh);
            obstacles.push({ minX: x-w/2, maxX: x+w/2, minZ: z-d/2, maxZ: z+d/2 });
        }
        for (let i = 0; i < 50; i++) {
            createBuilding(Math.random()*260-130, Math.random()*260-130, 8, Math.random()*20+5, 8);
        }

        // --- エリア（毒の霧）視覚化 ---
        const areaCircleGeo = new THREE.RingGeometry(1, 300, 64);
        const areaCircleMat = new THREE.MeshBasicMaterial({ color: 0x8800ff, side: THREE.DoubleSide, transparent: true, opacity: 0.4 });
        const areaCircle = new THREE.Mesh(areaCircleGeo, areaCircleMat);
        areaCircle.rotation.x = -Math.PI / 2;
        areaCircle.position.y = 0.1;
        scene.add(areaCircle);

        let areaRadius = 150;

        // --- プレイヤー ---
        const player = new THREE.Group();
        scene.add(player);
        const playerBody = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        playerBody.position.y = 0.5;
        player.add(playerBody);
        player.add(camera);
        camera.position.set(0, 3, 6);
        camera.lookAt(0, 1, -5);

        const stand = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0.5 }));
        stand.position.set(0, 0.6, -2.5);
        stand.visible = false;
        player.add(stand);

        let playerHP = 100, playerSH = 0;

        // --- 敵 (10倍: 80体) ---
        const enemies = [];
        function spawnEnemy() {
            const x = Math.random()*280-140, z = Math.random()*280-140;
            if (Math.abs(x) < 15 && Math.abs(z) < 15) return;
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshPhongMaterial({ color: 0xffff00 }));
            mesh.position.set(x, 0.6, z);
            scene.add(mesh);
            enemies.push({ mesh: mesh, alive: true, hp: 100 });
        }
        for(let i=0; i<80; i++) spawnEnemy();

        // --- アイテム ---
        const items = [];
        for(let i=0; i<30; i++) {
            const type = i%2===0 ? 'heal' : 'shield';
            const col = (type === 'heal') ? 0x00ff00 : 0x00aaff;
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshPhongMaterial({ color: col, emissive: col, emissiveIntensity: 0.5 }));
            mesh.position.set(Math.random()*260-130, 0.5, Math.random()*260-130);
            scene.add(mesh);
            items.push({ mesh: mesh, type: type, alive: true });
        }

        const keys = {};
        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        function checkCollision(newX, newZ) {
            for (let obs of obstacles) {
                if (newX+0.6 > obs.minX && newX-0.6 < obs.maxX && newZ+0.6 > obs.minZ && newZ-0.6 < obs.maxZ) return true;
            }
            return false;
        }

        let isAttacking = false;
        function attack() {
            if(isAttacking) return;
            isAttacking = true;
            stand.visible = true;
            const rushInterval = setInterval(() => {
                stand.position.set((Math.random()-0.5)*0.8, 0.6+(Math.random()-0.5)*0.6, -2.5+(Math.random()-0.5)*0.4);
                const standPos = new THREE.Vector3();
                stand.getWorldPosition(standPos);
                enemies.forEach(e => {
                    if(e.alive && standPos.distanceTo(e.mesh.position) < 2.5) {
                        e.hp -= 3; e.mesh.material.emissive.setHex(0xff0000);
                        setTimeout(() => e.mesh.material.emissive.setHex(0x000000), 30);
                    }
                });
            }, 30);
            setTimeout(() => {
                clearInterval(rushInterval);
                stand.visible = false; isAttacking = false;
                enemies.forEach(e => { if(e.alive && e.hp <= 0) { e.alive = false; scene.remove(e.mesh); } });
            }, 400);
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // エリア収縮
            if (areaRadius > 5) areaRadius -= delta * 1.5;
            areaCircle.geometry = new THREE.RingGeometry(areaRadius, 300, 64);
            document.getElementById('area-radius').innerText = "RADIUS: " + Math.floor(areaRadius);

            // エリア外ダメージ
            const distFromCenter = Math.sqrt(player.position.x**2 + player.position.z**2);
            if (distFromCenter > areaRadius) {
                playerHP -= delta * 5; // 毎秒5ダメージ
            }

            // プレイヤー移動
            if (keys['ArrowLeft']) player.rotation.y += 2.5 * delta;
            if (keys['ArrowRight']) player.rotation.y -= 2.5 * delta;
            const moveSpeed = 15 * delta, angle = player.rotation.y;
            const dirZ = (keys['KeyW'] ? -1 : 0) + (keys['KeyS'] ? 1 : 0);
            const dirX = (keys['KeyA'] ? -1 : 0) + (keys['KeyD'] ? 1 : 0);
            if (dirZ !== 0 || dirX !== 0) {
                let nX = player.position.x + (Math.sin(angle)*dirZ + Math.cos(angle)*dirX)*moveSpeed;
                let nZ = player.position.z + (Math.cos(angle)*dirZ - Math.sin(angle)*dirX)*moveSpeed;
                if (!checkCollision(nX, player.position.z)) player.position.x = nX;
                if (!checkCollision(player.position.x, nZ)) player.position.z = nZ;
            }
            if (keys['Space']) attack();

            // 敵AI
            enemies.forEach(e => {
                if(!e.alive) return;
                const dP = e.mesh.position.distanceTo(player.position);
                if(dP < 40) { // プレイヤーが近い時だけ追跡
                    const aP = Math.atan2(player.position.x - e.mesh.position.x, player.position.z - e.mesh.position.z);
                    const eX = e.mesh.position.x + Math.sin(aP)*8*delta, eZ = e.mesh.position.z + Math.cos(aP)*8*delta;
                    if (!checkCollision(eX, e.mesh.position.z)) e.mesh.position.x = eX;
                    if (!checkCollision(e.mesh.position.x, eZ)) e.mesh.position.z = eZ;
                }
                if(dP < 1.5) { if(playerSH > 0) playerSH -= 1; else playerHP -= 1; }
            });

            // アイテム
            items.forEach(it => {
                if(it.alive && player.position.distanceTo(it.mesh.position) < 1.5) {
                    it.alive = false; scene.remove(it.mesh);
                    if(it.type === 'heal') playerHP = Math.min(100, playerHP + 30);
                    else playerSH = Math.min(100, playerSH + 50);
                }
            });

            document.getElementById('hp-fill').style.width = playerHP + "%";
            document.getElementById('sh-fill').style.width = playerSH + "%";
            if(playerHP <= 0) { alert("RETIRED!"); location.reload(); }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
