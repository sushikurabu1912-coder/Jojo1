<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Tofu Survivor - 40 Player Battle Royale</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'MS Gothic', sans-serif; }
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 25, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; text-align: center; }
        .char-container { display: flex; gap: 20px; margin-top: 30px; }
        .char-card { border: 2px solid #555; padding: 20px; border-radius: 10px; cursor: pointer; transition: 0.3s; background: #111; width: 140px; }
        .char-card:hover { border-color: #f0f; transform: translateY(-10px); background: #222; }
        
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; }
        #area-ui { position: absolute; top: 10px; right: 10px; color: #f0f; background: rgba(0,0,0,0.8); padding: 10px; border: 2px solid #f0f; border-radius: 5px; font-weight: bold; text-align: right; }
        #status-ui { position: absolute; bottom: 20px; left: 20px; color: #fff; text-shadow: 2px 2px #000; }
        .bar-container { width: 220px; height: 12px; background: #333; border: 2px solid #fff; margin-bottom: 5px; overflow: hidden; }
        #hp-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }
        #shield-fill { width: 0%; height: 100%; background: #00aaff; transition: width 0.1s; }
        #warning { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); color: #ff0044; font-size: 40px; font-weight: bold; display: none; }
        
        /* 特殊エフェクト */
        #time-stop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: difference; background: white; display: none; z-index: 50; }
        #crimson-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: rgba(255, 0, 0, 0.2); display: none; z-index: 49; }
        #requiem-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-shadow: inset 0 0 100px rgba(255, 215, 0, 0.4); display: none; z-index: 48; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="font-size: 40px; color: #0ff;">40 PLAYER BATTLE ROYALE</h1>
        <div class="char-container">
            <div class="char-card" onclick="startGame('white')"><h3>WHITE (GER)</h3><p>5s 無敵</p></div>
            <div class="char-card" onclick="startGame('cyan')"><h3>CYAN (KC)</h3><p>6s 無敵+強撃</p></div>
            <div class="char-card" onclick="startGame('gold')"><h3>GOLD (SP)</h3><p>5s 時間停止</p></div>
        </div>
        <p style="margin-top:20px; color:#aaa;">Space: Attack | E: Ability | Arrows: Move</p>
    </div>

    <div id="time-stop-overlay"></div>
    <div id="crimson-overlay"></div>
    <div id="requiem-overlay"></div>

    <div id="ui-container">
        <div id="warning">⚠️AREA DAMAGE⚠️</div>
        <div id="area-ui">PLAYERS ALIVE: <span id="survivors-count">40</span><br>AREA: <span id="area-radius">250</span></div>
        <div id="status-ui">
            <div id="at-label" style="color:#f00; font-weight:bold;">ATTACK: READY</div>
            <div id="ts-label" style="color:#ff0; font-weight:bold;">ABILITY: READY</div>
            SHIELD <div class="bar-container"><div id="shield-fill"></div></div>
            HP <div class="bar-container"><div id="hp-fill"></div></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        let isGameStarted = false;
        let charStats = { speed: 22, attack: 45, color: 0xffffff, type: 'white' };
        let isTimeStopped = false, isErasingTime = false, isRequiem = false, hasCrit = false;
        let timeStopCooldown = 0, attackCooldown = 0, playerHP = 100, playerShield = 0, powerUpTimer = 0;
        let areaRadius = 250;
        
        const entities = [], obstacles = [], items = [], keys = {};
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000005);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(50, 100, 50); scene.add(sun);

        // 床とエリア
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshPhongMaterial({ color: 0x151515 }));
        floor.rotation.x = -Math.PI / 2; scene.add(floor);
        const areaWall = new THREE.Mesh(new THREE.CylinderGeometry(areaRadius, areaRadius, 120, 64, 1, true), new THREE.MeshBasicMaterial({ color: 0x8800ff, transparent: true, opacity: 0.3, side: THREE.DoubleSide }));
        areaWall.position.y = 60; scene.add(areaWall);

        // 障害物
        for (let i = 0; i < 60; i++) {
            const h = 20 + Math.random() * 40;
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(12, h, 12), new THREE.MeshPhongMaterial({ color: 0x222233 }));
            const rx = (Math.random() - 0.5) * 450, rz = (Math.random() - 0.5) * 450;
            if (Math.abs(rx) < 30 && Math.abs(rz) < 30) continue;
            mesh.position.set(rx, h/2, rz); scene.add(mesh);
            obstacles.push({ minX: rx-7, maxX: rx+7, minZ: rz-7, maxZ: rz+7 });
        }

        // プレイヤーのセットアップ
        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        pBody.position.y = 0.75; player.add(pBody);
        const pStand = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 2.5), new THREE.MeshPhongMaterial({ color: 0xff00ff, emissive: 0xff00ff, emissiveIntensity: 0.5 }));
        pStand.position.set(0, 0.75, -2); pStand.visible = false; player.add(pStand);
        scene.add(player); player.add(camera); camera.position.set(0, 10, 15); camera.lookAt(0, 0, -5);

        // BOTのスポーン
        function createEntity(isOtherPlayer = false) {
            const group = new THREE.Group();
            const color = isOtherPlayer ? 0xeeeeee : 0xffff00; // 他プレイヤーは白っぽく、BOTは黄色
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: color }));
            body.position.y = 0.75; group.add(body);
            
            const stand = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 2.2), new THREE.MeshPhongMaterial({ color: 0xff0044 }));
            stand.position.set(0, 0.75, -1.8); stand.visible = false; group.add(stand);
            
            const ang = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 150;
            group.position.set(Math.cos(ang)*dist, 0, Math.sin(ang)*dist);
            scene.add(group);
            return { group, stand, hp: 100, alive: true, id: Math.random(), attackCd: 0, isBot: !isOtherPlayer };
        }
        for(let i=0; i<39; i++) entities.push(createEntity(i < 5)); // 5人は他プレイヤー設定

        function spawnItem() {
            const types = [0x00ff00, 0xff0000, 0x00aaff];
            const type = types[Math.floor(Math.random() * types.length)];
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshPhongMaterial({ color: type, emissive: type, emissiveIntensity: 0.5 }));
            const ang = Math.random() * Math.PI * 2, dist = Math.random() * (areaRadius * 0.8);
            mesh.position.set(Math.cos(ang)*dist, 0.6, Math.sin(ang)*dist);
            scene.add(mesh); items.push({ mesh, type });
        }

        window.startGame = (type) => {
            if (type === 'white') charStats = { speed: 23, attack: 45, color: 0xffffff, type: 'white' };
            if (type === 'cyan') charStats = { speed: 28, attack: 35, color: 0x00ffff, type: 'cyan' };
            if (type === 'gold') charStats = { speed: 19, attack: 85, color: 0xffd700, type: 'gold' };
            pBody.material.color.setHex(charStats.color);
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block';
            for(let i=0; i<15; i++) spawnItem();
            isGameStarted = true;
        };

        function checkCollision(x, z) {
            for (let b of obstacles) if (x > b.minX && x < b.maxX && z > b.minZ && z < b.maxZ) return true;
            return false;
        }

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyE' && isGameStarted && timeStopCooldown <= 0) {
                if (charStats.type === 'gold') {
                    isTimeStopped = true; document.getElementById('time-stop-overlay').style.display = 'block';
                    setTimeout(() => { isTimeStopped = false; timeStopCooldown = 15; document.getElementById('time-stop-overlay').style.display = 'none'; }, 5000);
                }
                if (charStats.type === 'cyan') {
                    isErasingTime = true; pBody.material.opacity = 0.4; document.getElementById('crimson-overlay').style.display = 'block';
                    setTimeout(() => { isErasingTime = false; hasCrit = true; pBody.material.opacity = 1.0; timeStopCooldown = 12; document.getElementById('crimson-overlay').style.display = 'none'; }, 6000);
                }
                if (charStats.type === 'white') {
                    isRequiem = true; document.getElementById('requiem-overlay').style.display = 'block';
                    setTimeout(() => { isRequiem = false; timeStopCooldown = 20; document.getElementById('requiem-overlay').style.display = 'none'; }, 5000);
                }
            }
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            if (!isGameStarted) return;

            // クールダウン更新
            if (timeStopCooldown > 0 && !isTimeStopped && !isErasingTime && !isRequiem) timeStopCooldown -= delta;
            if (attackCooldown > 0) attackCooldown -= delta;
            if (powerUpTimer > 0) powerUpTimer -= delta;

            // プレイヤー移動
            const moveSpeed = charStats.speed * delta * (isTimeStopped || isErasingTime ? 1.3 : 1.0);
            if (keys['ArrowLeft']) player.rotation.y += 3 * delta;
            if (keys['ArrowRight']) player.rotation.y -= 3 * delta;
            const mx = (keys['KeyD']?1:0) - (keys['KeyA']?1:0), mz = (keys['KeyS']?1:0) - (keys['KeyW']?1:0);
            if (mx !== 0 || mz !== 0) {
                const moveVec = new THREE.Vector3(mx, 0, mz).normalize().multiplyScalar(moveSpeed).applyQuaternion(player.quaternion);
                if (!checkCollision(player.position.x + moveVec.x, player.position.z + moveVec.z)) {
                    player.position.x += moveVec.x; player.position.z += moveVec.z;
                }
            }

            // プレイヤー攻撃
            if (keys['Space'] && attackCooldown <= 0) {
                attackCooldown = 0.8; pStand.visible = true;
                const dmg = charStats.attack * (hasCrit?3:1) * (powerUpTimer>0?2:1); hasCrit = false;
                setTimeout(() => pStand.visible = false, 300);
                entities.forEach(e => {
                    const hitPos = player.position.clone().add(new THREE.Vector3(0,0,-3).applyQuaternion(player.quaternion));
                    if (e.alive && e.group.position.distanceTo(hitPos) < 4) e.hp -= dmg;
                });
            }

            // BOT AI と 処理
            if (!isTimeStopped) {
                areaRadius -= delta * 0.8;
                areaWall.geometry.dispose();
                areaWall.geometry = new THREE.CylinderGeometry(areaRadius, areaRadius, 120, 64, 1, true);

                entities.forEach(e => {
                    if (!e.alive) return;
                    
                    // ターゲット選定（自分以外で一番近いキャラ）
                    let targetPos = player.position;
                    let minDist = e.group.position.distanceTo(player.position);
                    entities.forEach(other => {
                        if (other.alive && other.id !== e.id) {
                            const d = e.group.position.distanceTo(other.group.position);
                            if (d < minDist) { minDist = d; targetPos = other.group.position; }
                        }
                    });

                    // 移動ロジック
                    const dir = targetPos.clone().sub(e.group.position).normalize();
                    if (e.group.position.length() > areaRadius * 0.9) {
                        dir.copy(e.group.position).negate().normalize(); // エリア内へ逃げる
                    }
                    
                    if (minDist > 3) {
                        const nextX = e.group.position.x + dir.x * 8 * delta;
                        const nextZ = e.group.position.z + dir.z * 8 * delta;
                        if (!checkCollision(nextX, nextZ)) { e.group.position.x = nextX; e.group.position.z = nextZ; }
                    }
                    e.group.lookAt(targetPos.x, 0, targetPos.z);

                    // BOT攻撃ロジック（可視化）
                    e.attackCd -= delta;
                    if (minDist < 5 && e.attackCd <= 0) {
                        e.attackCd = 1.5 + Math.random();
                        e.stand.visible = true;
                        setTimeout(() => e.stand.visible = false, 400);
                        if (e.group.position.distanceTo(player.position) < 3) {
                            if (!isRequiem && !isErasingTime) {
                                if (playerShield > 0) playerShield -= 15; else playerHP -= 15;
                            }
                        }
                        entities.forEach(other => {
                            if (other.alive && other.id !== e.id && e.group.position.distanceTo(other.group.position) < 3) other.hp -= 15;
                        });
                    }

                    if (e.group.position.length() > areaRadius) e.hp -= delta * 20;
                    if (e.hp <= 0) { e.alive = false; scene.remove(e.group); }
                });
            }

            // エリアダメージ
            if (player.position.length() > areaRadius) {
                applyDamage(delta * 15);
                document.getElementById('warning').style.display = 'block';
            } else document.getElementById('warning').style.display = 'none';

            function applyDamage(dmg) {
                if (isRequiem || isErasingTime) return;
                if (playerShield > 0) playerShield -= dmg; else playerHP -= dmg;
            }

            // UI更新
            const aliveCount = entities.filter(e => e.alive).length + 1;
            document.getElementById('hp-fill').style.width = Math.max(0, playerHP) + "%";
            document.getElementById('shield-fill').style.width = Math.max(0, playerShield) + "%";
            document.getElementById('survivors-count').innerText = aliveCount;
            document.getElementById('area-radius').innerText = Math.floor(areaRadius);
            document.getElementById('ts-label').innerText = timeStopCooldown > 0 ? `CD: ${Math.ceil(timeStopCooldown)}` : "READY (E)";

            if (playerHP <= 0) { alert("RANK: " + aliveCount); location.reload(); }
            if (aliveCount === 1) { alert("CHICKEN DINNER! WINNER!"); location.reload(); }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
