<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Web Survivor - Keyboard Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a0022; font-family: 'MS Gothic', sans-serif; }
        #ui { position: absolute; bottom: 20px; left: 20px; color: #ff00ff; text-shadow: 2px 2px #00ffff; font-size: 28px; font-weight: bold; }
        #instructions { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.7); padding: 15px; border: 2px solid #ff00ff; border-radius: 10px; line-height: 1.5; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: rgba(255,255,255,0.5); font-size: 30px; }
    </style>
</head>
<body>

    <div id="instructions">
        <b>【操作方法】</b><br>
        WASD：移動<br>
        矢印キー(← →)：視点回転<br>
        矢印キー(↑ ↓)：上下見渡し<br>
        <b>スペースキー：スタンド攻撃(ラッシュ)</b>
    </div>
    <div id="crosshair">＋</div>
    <div id="ui">HP: <span id="hp">100</span> | STAND READY</div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        // --- 基本設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a0022); 
        scene.fog = new THREE.FogExp2(0x1a0022, 0.03);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
        scene.add(light);

        // --- 地面と建物 ---
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshPhongMaterial({ color: 0x333333 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        for(let i=0; i<30; i++) {
            const h = Math.random()*15+5;
            const box = new THREE.Mesh(new THREE.BoxGeometry(4, h, 4), new THREE.MeshPhongMaterial({ color: 0x442266 }));
            box.position.set(Math.random()*100-50, h/2, Math.random()*100-50);
            scene.add(box);
        }

        // --- プレイヤーとスタンドの腕 ---
        const player = new THREE.Group();
        scene.add(player);
        player.position.y = 1.6;
        player.add(camera);

        const standArm = new THREE.Mesh(
            new THREE.BoxGeometry(0.6, 0.6, 2.5), 
            new THREE.MeshPhongMaterial({ color: 0x00ffff, emissive: 0x008888 })
        );
        standArm.position.set(0.7, -0.5, -1.5);
        standArm.visible = false;
        player.add(standArm);

        // --- 入力管理 ---
        const keys = {};
        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        // 攻撃処理（スペースキー）
        function attack() {
            if(standArm.visible) return;
            standArm.visible = true;
            // ラッシュっぽく細かく震わせる
            const interval = setInterval(() => {
                standArm.position.x = 0.6 + Math.random() * 0.2;
            }, 50);
            setTimeout(() => { 
                clearInterval(interval);
                standArm.visible = false; 
                standArm.position.x = 0.7;
            }, 200);
        }

        // --- メインループ ---
        const velocity = new THREE.Vector3();
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // 1. 視点移動 (矢印キー)
            if (keys['ArrowLeft']) player.rotation.y += 2.0 * delta;
            if (keys['ArrowRight']) player.rotation.y -= 2.0 * delta;
            if (keys['ArrowUp']) camera.rotation.x += 1.5 * delta;
            if (keys['ArrowDown']) camera.rotation.x -= 1.5 * delta;
            camera.rotation.x = Math.max(-Math.PI/3, Math.min(Math.PI/3, camera.rotation.x));

            // 2. 移動 (WASD)
            const moveStep = 10 * delta;
            if (keys['KeyW']) player.translateZ(-moveStep);
            if (keys['KeyS']) player.translateZ(moveStep);
            if (keys['KeyA']) player.translateX(-moveStep);
            if (keys['KeyD']) player.translateX(moveStep);

            // 3. 攻撃 (Space)
            if (keys['Space']) attack();

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
