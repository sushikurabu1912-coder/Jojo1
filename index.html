<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Jojo Tofu Survivor - Rush Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'MS Gothic', sans-serif; }
        #ui { position: absolute; bottom: 20px; left: 20px; color: #fff; text-shadow: 2px 2px #000; font-size: 24px; font-weight: bold; pointer-events: none; }
        .bar-container { width: 200px; height: 15px; background: #333; border: 2px solid #fff; margin-top: 5px; }
        #hp-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }
        #sh-fill { width: 0%; height: 100%; background: #0cf; transition: width 0.1s; }
        #instructions { position: absolute; top: 10px; left: 10px; color: #000; background: rgba(255,255,255,0.8); padding: 15px; border: 2px solid #333; border-radius: 10px; pointer-events: none; font-size: 14px; }
    </style>
</head>
<body>

    <div id="instructions">
        WASD：移動 / 矢印キー：視点操作 / Space：<b>オラオララッシュ！</b><br>
        敵の体力が大幅アップ！何度も叩き込め！
    </div>
    <div id="ui">
        SHIELD <div class="bar-container"><div id="sh-fill"></div></div>
        HP <div class="bar-container"><div id="hp-fill"></div></div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        const obstacles = [];
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshPhongMaterial({ color: 0x999999 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        function createBuilding(x, z, w, h, d, color) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshPhongMaterial({ color: color }));
            mesh.position.set(x, h/2, z);
            scene.add(mesh);
            obstacles.push({ minX: x-w/2, maxX: x+w/2, minZ: z-d/2, maxZ: z+d/2 });
        }
        for (let i = 0; i < 40; i++) {
            const x = Math.random()*240-120, z = Math.random()*240-120;
            if (Math.abs(x) < 20 && Math.abs(z) < 20) continue;
            createBuilding(x, z, 8, Math.random()*15+5, 8, 0x777777);
        }

        const player = new THREE.Group();
        scene.add(player);
        const playerBody = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        playerBody.position.y = 0.5;
        player.add(playerBody);
        player.add(camera);
        camera.position.set(0, 3, 6);
        camera.lookAt(0, 1, -5);

        const stand = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 0.5 }));
        stand.position.set(0, 0.6, -2.5);
        stand.visible = false;
        player.add(stand);

        let playerHP = 100, playerSH = 0;

        // --- 敵の体力を10倍(100)に設定 ---
        const enemies = [];
        function spawnEnemy(x, z) {
            const enemyBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshPhongMaterial({ color: 0xffff00 }));
            enemyBody.position.set(x, 0.6, z);
            scene.add(enemyBody);
            // HPを10倍(100)に。元々は1撃(10)だったので実質10倍の耐久
            enemies.push({ mesh: enemyBody, alive: true, hp: 100 });
        }
        for(let i=0; i<8; i++) spawnEnemy(Math.random()*200-100, Math.random()*200-100);

        const items = [];
        function spawnItem(x, z, type) {
            const color = (type === 'heal') ? 0x00ff00 : 0x00aaff;
            const itemMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshPhongMaterial({ color: color, emissive: color, emissiveIntensity: 0.5 }));
            itemMesh.position.set(x, 0.5, z);
            scene.add(itemMesh);
            items.push({ mesh: itemMesh, type: type, alive: true });
        }
        for(let i=0; i<15; i++) spawnItem(Math.random()*200-100, Math.random()*200-100, i%2===0 ? 'heal' : 'shield');

        const keys = {};
        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        function checkCollision(newX, newZ) {
            for (let obs of obstacles) {
                if (newX+0.6 > obs.minX && newX-0.6 < obs.maxX && newZ+0.6 > obs.minZ && newZ-0.6 < obs.maxZ) return true;
            }
            return false;
        }

        // --- スタンド攻撃（ブルブル震える演出） ---
        let isAttacking = false;
        function attack() {
            if(isAttacking) return;
            isAttacking = true;
            stand.visible = true;

            const startTime = Date.now();
            const rushDuration = 400; // 0.4秒

            const rushInterval = setInterval(() => {
                // ブルブル震える（X, Y, Z軸にランダム振動）
                stand.position.x = (Math.random() - 0.5) * 0.8;
                stand.position.y = 0.6 + (Math.random() - 0.5) * 0.6;
                stand.position.z = -2.5 + (Math.random() - 0.5) * 0.4;
                
                // 振動中に当たり判定を何度も計算（多段ヒット感）
                const standPos = new THREE.Vector3();
                stand.getWorldPosition(standPos);
                enemies.forEach(enemy => {
                    if(enemy.alive && standPos.distanceTo(enemy.mesh.position) < 2.5) {
                        enemy.hp -= 2; // 1回の振動ごとにダメージ
                        enemy.mesh.material.emissive.setHex(0xff0000); // 被弾で赤く光る
                        setTimeout(() => enemy.mesh.material.emissive.setHex(0x000000), 50);
                    }
                });
            }, 30);

            setTimeout(() => {
                clearInterval(rushInterval);
                stand.visible = false;
                stand.position.set(0, 0.6, -2.5);
                isAttacking = false;
                
                // 死亡判定チェック
                enemies.forEach(enemy => {
                    if(enemy.alive && enemy.hp <= 0) {
                        enemy.alive = false; enemy.mesh.visible = false; scene.remove(enemy.mesh);
                    }
                });
            }, rushDuration);
        }

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (keys['ArrowLeft']) player.rotation.y += 2.5 * delta;
            if (keys['ArrowRight']) player.rotation.y -= 2.5 * delta;
            const moveSpeed = 15 * delta, angle = player.rotation.y;
            const dirZ = (keys['KeyW'] ? -1 : 0) + (keys['KeyS'] ? 1 : 0);
            const dirX = (keys['KeyA'] ? -1 : 0) + (keys['KeyD'] ? 1 : 0);
            if (dirZ !== 0 || dirX !== 0) {
                let nX = player.position.x + (Math.sin(angle)*dirZ + Math.cos(angle)*dirX)*moveSpeed;
                let nZ = player.position.z + (Math.cos(angle)*dirZ - Math.sin(angle)*dirX)*moveSpeed;
                if (!checkCollision(nX, player.position.z)) player.position.x = nX;
                if (!checkCollision(player.position.x, nZ)) player.position.z = nZ;
            }
            if (keys['Space']) attack();

            enemies.forEach(enemy => {
                if(!enemy.alive) return;
                const angleToP = Math.atan2(player.position.x - enemy.mesh.position.x, player.position.z - enemy.mesh.position.z);
                const eX = enemy.mesh.position.x + Math.sin(angleToP)*7*delta, eZ = enemy.mesh.position.z + Math.cos(angleToP)*7*delta;
                if (!checkCollision(eX, enemy.mesh.position.z)) enemy.mesh.position.x = eX;
                if (!checkCollision(enemy.mesh.position.x, eZ)) enemy.mesh.position.z = eZ;
                if(enemy.mesh.position.distanceTo(player.position) < 1.5) {
                    if(playerSH > 0) playerSH -= 0.8; else playerHP -= 0.8;
                }
            });

            items.forEach(item => {
                if(!item.alive) return;
                item.mesh.rotation.y += delta * 2;
                if(player.position.distanceTo(item.mesh.position) < 1.5) {
                    item.alive = false; scene.remove(item.mesh);
                    if(item.type === 'heal') playerHP = Math.min(100, playerHP + 30);
                    if(item.type === 'shield') playerSH = Math.min(100, playerSH + 50);
                }
            });

            document.getElementById('hp-fill').style.width = playerHP + "%";
            document.getElementById('sh-fill').style.width = playerSH + "%";
            if(playerHP <= 0) { alert("RETIRED!"); location.reload(); }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
