<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TOFU SURVIVOR: THE ULTIMATE DECISION</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', sans-serif; user-select: none; }
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 30, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; text-align: center; }
        .char-container { display: flex; gap: 20px; margin-top: 30px; }
        .char-card { border: 3px solid #444; padding: 20px; border-radius: 15px; cursor: pointer; transition: 0.3s; background: #111; width: 160px; }
        .char-card:hover { border-color: #f0f; transform: translateY(-10px); box-shadow: 0 0 20px #f0f; background: #1a1a1a; }
        .char-card h3 { margin: 10px 0; letter-spacing: 2px; }
        
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; }
        #area-ui { position: absolute; top: 20px; right: 20px; color: #f0f; background: rgba(0,0,0,0.8); padding: 15px; border: 2px solid #f0f; border-radius: 10px; font-weight: bold; text-align: right; line-height: 1.5; }
        #status-ui { position: absolute; bottom: 30px; left: 30px; color: #fff; text-shadow: 2px 2px #000; }
        .bar-container { width: 250px; height: 15px; background: #222; border: 2px solid #fff; margin-bottom: 8px; overflow: hidden; border-radius: 3px; }
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #0a0, #0f0); transition: width 0.2s; }
        #shield-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #0055ff, #00aaff); transition: width 0.2s; }
        #skill-ui { color: #ff0; font-weight: bold; font-size: 18px; margin-bottom: 10px; text-transform: uppercase; }
        #warning { position: absolute; top: 35%; left: 50%; transform: translateX(-50%); color: #ff0044; font-size: 48px; font-weight: bold; display: none; text-shadow: 0 0 10px #000; }
        #controls-hint { position: absolute; bottom: 20px; right: 20px; color: rgba(255,255,255,0.5); font-size: 12px; text-align: right; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="font-size: 48px; color: #f0f; text-shadow: 0 0 20px #f0f;">TOFU SURVIVOR</h1>
        <p style="color: #aaa;">最終調整版：敵の自滅を抑制。スタンドの衝撃を体感せよ。</p>
        <div class="char-container">
            <div class="char-card" onclick="startGame('white')"><h3 style="color:#fff">WHITE</h3><p>無敵化<br>[E] 3秒間</p></div>
            <div class="char-card" onclick="startGame('cyan')"><h3 style="color:#0ff">CYAN</h3><p>時飛ばし<br>[E] 2.5秒間</p></div>
            <div class="char-card" onclick="startGame('gold')"><h3 style="color:#fd0">GOLD</h3><p>時停止<br>[E] 4秒間</p></div>
        </div>
    </div>

    <div id="ui-container">
        <div id="warning">⚠️ OUT OF AREA ⚠️</div>
        <div id="area-ui">
            SURVIVORS: <span id="survivors-count">40</span><br>
            SAFE RADIUS: <span id="area-radius">250</span>m
        </div>
        <div id="status-ui">
            <div id="skill-ui">SKILL READY [E]</div>
            SHIELD <div class="bar-container"><div id="shield-fill"></div></div>
            HP <div class="bar-container"><div id="hp-fill"></div></div>
        </div>
        <div id="controls-hint">WASD: MOVE | ARROWS: ROTATE | SPACE: STAND ATTACK (Shake!)</div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        // --- Game State ---
        let isGameStarted = false, areaRadius = 250;
        let charStats = { speed: 22, attack: 45, color: 0xffffff, type: 'white' };
        let playerHP = 100, playerShield = 0;
        let isInvincible = false, isTimeStopped = false, isTimeSkipping = false;
        let skillCd = 0;
        const entities = [], obstacles = [], items = [], keys = {};

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000005);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2); 
        sun.position.set(50, 100, 50); scene.add(sun);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshPhongMaterial({ color: 0x111111 }));
        floor.rotation.x = -Math.PI / 2; scene.add(floor);

        // --- Obstacles (Buildings with strict collision) ---
        const colors = [0xff4444, 0x44ff44, 0x4444ff, 0xffff44, 0xff44ff, 0x44ffff];
        const gridSize = 40, range = 240;
        for(let x = -range; x <= range; x += gridSize) {
            for(let z = -range; z <= range; z += gridSize) {
                if (Math.abs(x) < 25 && Math.abs(z) < 25) continue;
                const h = 15 + Math.random() * 35, w = 8 + Math.random() * 4;
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), new THREE.MeshPhongMaterial({ color: colors[Math.floor(Math.random()*colors.length)] }));
                const posX = x + (Math.random() - 0.5) * gridSize * 0.8;
                const posZ = z + (Math.random() - 0.5) * gridSize * 0.8;
                mesh.position.set(posX, h/2, posZ);
                scene.add(mesh);
                obstacles.push({ mesh, radius: w/2 + 1.2 });
            }
        }

        // --- Items ---
        function spawnItem() {
            const type = Math.random() > 0.5 ? 'hp' : 'shield';
            const color = type === 'hp' ? 0x00ff00 : 0x00aaff;
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(1.0), new THREE.MeshPhongMaterial({ color, emissive: color }));
            let tx, tz, ok = false;
            while(!ok) {
                const ang = Math.random() * Math.PI * 2, dist = Math.random() * areaRadius;
                tx = Math.cos(ang) * dist; tz = Math.sin(ang) * dist;
                if (!obstacles.some(o => new THREE.Vector2(tx, tz).distanceTo(new THREE.Vector2(o.mesh.position.x, o.mesh.position.z)) < o.radius + 2)) ok = true;
            }
            mesh.position.set(tx, 1.0, tz);
            scene.add(mesh);
            items.push({ mesh, type });
        }
        for(let i=0; i<15; i++) spawnItem();

        // --- Area Wall ---
        const areaWall = new THREE.Mesh(new THREE.CylinderGeometry(areaRadius, areaRadius, 150, 64, 1, true), new THREE.MeshBasicMaterial({ color: 0x8800ff, transparent: true, opacity: 0.3, side: THREE.DoubleSide }));
        areaWall.position.y = 75; scene.add(areaWall);

        // --- Player ---
        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        pBody.position.y = 0.75; player.add(pBody);
        const pStand = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.8, 1.8), new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x660000 }));
        pStand.visible = false; scene.add(pStand); 
        scene.add(player); 
        player.add(camera); camera.position.set(0, 15, 20); camera.lookAt(0, 0, -5);

        // --- Entities (Elite AI - Long Life Adjust) ---
        function createEntity() {
            const group = new THREE.Group();
            const bodyColor = [0xffff00, 0x00ffff, 0xff00ff, 0xff8800][Math.floor(Math.random()*4)];
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: bodyColor }));
            body.position.y = 0.75; group.add(body);
            const stand = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.2, 2.2), new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x330000 }));
            stand.visible = false; scene.add(stand);
            let tx, tz, spawned = false;
            while(!spawned) {
                const ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 170;
                tx = Math.cos(ang)*dist; tz = Math.sin(ang)*dist;
                if (!obstacles.some(o => new THREE.Vector3(tx, 0, tz).distanceTo(o.mesh.position) < o.radius + 4)) spawned = true;
            }
            group.position.set(tx, 0, tz);
            scene.add(group);
            return { 
                group, stand, hp: 100, alive: true, id: Math.random(), attackCd: 0, 
                wanderAngle: Math.random() * Math.PI * 2,
                stateTimer: 0, strafeDir: Math.random() > 0.5 ? 1 : -1
            };
        }
        for(let i=0; i<39; i++) entities.push(createEntity());

        window.startGame = (type) => {
            if (type === 'white') charStats = { speed: 25, attack: 55, color: 0xffffff, type };
            if (type === 'cyan') charStats = { speed: 32, attack: 40, color: 0x00ffff, type };
            if (type === 'gold') charStats = { speed: 20, attack: 95, color: 0xffd700, type };
            pBody.material.color.setHex(charStats.color);
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block';
            isGameStarted = true;
        };

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        let pAttackCd = 0;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            if (!isGameStarted) return;

            if (skillCd > 0) skillCd -= delta;

            // --- Player Movement & Collision ---
            const pSpeed = charStats.speed * delta;
            if (keys['ArrowLeft']) player.rotation.y += 3.6 * delta;
            if (keys['ArrowRight']) player.rotation.y -= 3.6 * delta;
            const mx = (keys['KeyD']?1:0) - (keys['KeyA']?1:0), mz = (keys['KeyS']?1:0) - (keys['KeyW']?1:0);
            if (mx !== 0 || mz !== 0) {
                const moveVec = new THREE.Vector3(mx, 0, mz).normalize().multiplyScalar(pSpeed).applyQuaternion(player.quaternion);
                let nextP = player.position.clone().add(moveVec);
                if (!obstacles.some(o => nextP.distanceTo(o.mesh.position) < o.radius)) player.position.copy(nextP);
            }

            // --- Skill Logic ---
            if (keys['KeyE'] && skillCd <= 0) {
                skillCd = 12;
                if (charStats.type === 'white') {
                    isInvincible = true; pBody.material.emissive.setHex(0xffffff);
                    setTimeout(() => { isInvincible = false; pBody.material.emissive.setHex(0x000000); }, 3000);
                } else if (charStats.type === 'cyan') {
                    isTimeSkipping = true; scene.background.setHex(0x000022);
                    setTimeout(() => { isTimeSkipping = false; scene.background.setHex(0x000005); }, 2500);
                } else if (charStats.type === 'gold') {
                    isTimeStopped = true; scene.background.setHex(0x222200);
                    setTimeout(() => { isTimeStopped = false; scene.background.setHex(0x000005); }, 4000);
                }
            }

            // --- Player Attack with IMPACT SHAKE ---
            pAttackCd -= delta;
            if (keys['Space'] && pAttackCd <= 0) {
                pAttackCd = 0.5;
                const attackDir = new THREE.Vector3(0,0,-1).applyQuaternion(player.quaternion);
                pStand.userData.basePos = player.position.clone().add(attackDir.clone().multiplyScalar(3.2));
                pStand.visible = true;
                setTimeout(() => pStand.visible = false, 180);
                entities.forEach(e => {
                    if (e.alive && e.group.position.distanceTo(pStand.userData.basePos) < 5.2) e.hp -= charStats.attack;
                });
            }

            if (pStand.visible) {
                pStand.position.copy(pStand.userData.basePos);
                pStand.position.x += (Math.random() - 0.5) * 0.95;
                pStand.position.y = 1.5 + (Math.random() - 0.5) * 0.95;
                pStand.position.z += (Math.random() - 0.5) * 0.95;
            }

            // --- Bot AI (Battle Pacing Adjustments) ---
            const botDelta = isTimeStopped ? 0 : (isTimeSkipping ? delta * 0.3 : delta);
            areaRadius -= botDelta * 0.75;
            areaWall.geometry.dispose();
            areaWall.geometry = new THREE.CylinderGeometry(areaRadius, areaRadius, 150, 64, 1, true);

            entities.forEach(e => {
                if (!e.alive || isTimeStopped) return;

                let target = player;
                let minDist = e.group.position.distanceTo(player.position);
                entities.forEach(other => {
                    if (other.alive && other.id !== e.id) {
                        const d = e.group.position.distanceTo(other.group.position);
                        if (d < minDist) { minDist = d; target = other.group; }
                    }
                });

                let moveDir = new THREE.Vector3();
                if (minDist < 55) {
                    const toTarget = new THREE.Vector3().subVectors(target.position, e.group.position).normalize();
                    if (minDist > 8.5) moveDir.copy(toTarget);
                    else if (minDist < 5.0) moveDir.copy(toTarget).negate();
                    moveDir.add(new THREE.Vector3(-toTarget.z, 0, toTarget.x).multiplyScalar(e.strafeDir * 0.9)).normalize();
                    
                    e.stateTimer -= botDelta;
                    if (e.stateTimer <= 0) { e.strafeDir *= -1; e.stateTimer = 2 + Math.random() * 2; }

                    e.attackCd -= botDelta;
                    if (minDist < 8.0 && e.attackCd <= 0) {
                        e.attackCd = 2.0 + Math.random(); // Longer cooldown for bots
                        e.stand.userData.basePos = e.group.position.clone().add(toTarget.multiplyScalar(3.2));
                        e.stand.visible = true;
                        setTimeout(() => e.stand.visible = false, 350);
                        
                        // Impact on Player
                        if (e.stand.userData.basePos.distanceTo(player.position) < 5.2 && !isInvincible) {
                            if (playerShield > 0) playerShield -= 15; else playerHP -= 15;
                        }
                        // Impact on other Bots (Reduced Damage to keep survivors alive)
                        entities.forEach(v => {
                            if (v.alive && v.id !== e.id && e.stand.userData.basePos.distanceTo(v.group.position) < 5.2) {
                                v.hp -= 4; // Low damage for bot-vs-bot
                            }
                        });
                    }
                } else {
                    e.wanderAngle += (Math.random() - 0.5) * 0.3;
                    moveDir.set(Math.cos(e.wanderAngle), 0, Math.sin(e.wanderAngle));
                }

                // Bot Stand Shake
                if (e.stand.visible) {
                    e.stand.position.copy(e.stand.userData.basePos);
                    e.stand.position.x += (Math.random() - 0.5) * 0.7;
                    e.stand.position.y = 1.5 + (Math.random() - 0.5) * 0.7;
                    e.stand.position.z += (Math.random() - 0.5) * 0.7;
                }

                if (e.group.position.length() > areaRadius * 0.75) moveDir.add(e.group.position.clone().negate().normalize().multiplyScalar(1.5)).normalize();
                
                const nextB = e.group.position.clone().add(moveDir.multiplyScalar(13 * botDelta));
                if (!obstacles.some(o => nextB.distanceTo(o.mesh.position) < o.radius)) e.group.position.copy(nextB);
                
                if (moveDir.length() > 0.1) e.group.lookAt(e.group.position.x + moveDir.x, 0, e.group.position.z + moveDir.z);
                if (e.group.position.length() > areaRadius) e.hp -= botDelta * 30; // Mild area damage for bots
                if (e.hp <= 0) { e.alive = false; scene.remove(e.group); scene.remove(e.stand); }
            });

            // --- UI & Items ---
            items.forEach((it, idx) => {
                if (player.position.distanceTo(it.mesh.position) < 2.5) {
                    if (it.type === 'hp') playerHP = Math.min(100, playerHP + 40);
                    else playerShield = Math.min(100, playerShield + 60);
                    scene.remove(it.mesh); items.splice(idx, 1); setTimeout(spawnItem, 8000);
                }
            });

            if (player.position.length() > areaRadius) playerHP -= delta * 25;
            document.getElementById('warning').style.display = (player.position.length() > areaRadius) ? 'block' : 'none';
            document.getElementById('hp-fill').style.width = Math.max(0, playerHP) + "%";
            document.getElementById('shield-fill').style.width = playerShield + "%";
            document.getElementById('survivors-count').innerText = entities.filter(e => e.alive).length + 1;
            document.getElementById('area-radius').innerText = Math.floor(areaRadius);

            if (playerHP <= 0) { alert("RANK: " + (entities.filter(e => e.alive).length + 1)); location.reload(); }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
