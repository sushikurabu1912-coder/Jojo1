<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TOFU SURVIVOR: HYBRID EDITION</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', sans-serif; user-select: none; transition: filter 0.3s; touch-action: none; }
        .time-stopped { filter: invert(100%) hue-rotate(180deg); }
        #time-skip-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 0, 0, 0.3); pointer-events: none; z-index: 50; display: none; }
        .full-screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; }
        #start-screen { background: rgba(0, 0, 30, 0.95); color: white; }
        
        .mode-selection { display: flex; gap: 20px; margin-bottom: 20px; }
        .mode-btn { padding: 10px 20px; border: 2px solid #fff; cursor: pointer; border-radius: 5px; background: #222; color: #fff; font-weight: bold; }
        .mode-btn.active { background: #f0f; border-color: #fff; box-shadow: 0 0 15px #f0f; }

        .char-container { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
        .char-card { border: 3px solid #444; padding: 15px; border-radius: 15px; cursor: pointer; transition: 0.3s; background: #111; width: 110px; }
        .char-card:hover { border-color: #f0f; transform: translateY(-5px); }
        
        #gameover-screen { background: rgba(50, 0, 0, 0.9); color: #ff0044; display: none; z-index: 200; cursor: pointer; }
        .retire-text { font-size: 60px; font-weight: bold; text-shadow: 0 0 20px #000; margin: 0; }
        
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; }
        #area-ui { position: absolute; top: 10px; right: 10px; color: #f0f; background: rgba(0,0,0,0.8); padding: 10px; border: 2px solid #f0f; border-radius: 10px; font-weight: bold; font-size: 14px; text-align: right; }
        #status-ui { position: absolute; bottom: 20px; left: 20px; color: #fff; text-shadow: 2px 2px #000; }
        .bar-container { width: 200px; height: 12px; background: #222; border: 2px solid #fff; margin-bottom: 5px; overflow: hidden; border-radius: 3px; }
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #0a0, #0f0); transition: width 0.2s; }
        #shield-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #0055ff, #00aaff); transition: width 0.2s; }
        #skill-ui { color: #ff0; font-weight: bold; font-size: 14px; margin-bottom: 5px; text-transform: uppercase; }
        
        /* Mobile Controls */
        #mobile-controls { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        .joystick { position: absolute; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; }
        #move-stick { bottom: 40px; left: 40px; }
        #action-stick { bottom: 40px; right: 40px; }
        .stick-knob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); }
        #skill-btn { position: absolute; bottom: 180px; right: 60px; width: 70px; height: 70px; background: rgba(255,255,0,0.3); border: 2px solid #ff0; border-radius: 50%; pointer-events: auto; color: #ff0; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 12px; }

        #warning { position: absolute; top: 35%; left: 50%; transform: translateX(-50%); color: #ff0044; font-size: 32px; font-weight: bold; display: none; }
        #victory-message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 40px; font-weight: bold; text-shadow: 0 0 20px #f0f; display: none; z-index: 200; text-align: center; pointer-events: auto; }
    </style>
</head>
<body>
    <div id="time-skip-overlay"></div>
    <div id="victory-message">YOU ARE THE LAST SURVIVOR !!<br><span style="font-size: 18px; color: #ccc;">(Tap to Restart)</span></div>
    
    <div id="gameover-screen" class="full-screen-overlay" onclick="location.reload()">
        <p class="retire-text">RETIRE</p>
        <p>RANK: <span id="final-rank">0</span> / 40</p>
        <p style="color: #aaa; margin-top: 20px;">Tap to Re-Challenge</p>
    </div>

    <div id="start-screen" class="full-screen-overlay">
        <h1 style="font-size: 32px; color: #f0f;">TOFU SURVIVOR</h1>
        
        <div class="mode-selection">
            <div id="mode-pc" class="mode-btn active" onclick="setMode('pc')">KEYBOARD</div>
            <div id="mode-mobile" class="mode-btn" onclick="setMode('mobile')">TOUCH</div>
        </div>

        <div class="char-container">
            <div class="char-card" onclick="startGame('white')"><h3 style="color:#fff">WHITE</h3><p style="font-size:10px">無敵化</p></div>
            <div class="char-card" onclick="startGame('cyan')"><h3 style="color:#0ff">CYAN</h3><p style="font-size:10px">時飛ばし</p></div>
            <div class="char-card" onclick="startGame('gold')"><h3 style="color:#fd0">GOLD</h3><p style="font-size:10px">時停止</p></div>
        </div>
    </div>

    <div id="ui-container">
        <div id="warning">⚠️ OUT OF AREA ⚠️</div>
        <div id="area-ui">SURVIVORS: <span id="survivors-count">40</span><br>RADIUS: <span id="area-radius">250</span>m</div>
        <div id="status-ui">
            <div id="skill-ui">CARDS: 0 / 3</div>
            SHIELD <div class="bar-container"><div id="shield-fill"></div></div>
            HP <div class="bar-container"><div id="hp-fill"></div></div>
        </div>
    </div>

    <div id="mobile-controls">
        <div id="move-stick" class="joystick"><div id="move-knob" class="stick-knob"></div></div>
        <div id="action-stick" class="joystick"><div id="action-knob" class="stick-knob"></div></div>
        <div id="skill-btn">SKILL</div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        let isGameStarted = false, areaRadius = 250, isGameOver = false;
        let charStats = { speed: 22, attack: 15, color: 0xffffff, type: 'white' };
        let playerHP = 100, playerShield = 0, inputMode = 'pc';
        let isInvincible = false, isTimeStopped = false, isTimeSkipping = false;
        let skillCd = 0, collectedCards = 0, skillUses = 0;
        const entities = [], obstacles = [], items = [], keys = {};
        let pCameraShakeAmount = 0;
        const P_CAMERA_BASE_POS = new THREE.Vector3(0, 15, 20);

        // Mobile joystick states
        const joystickData = { move: { x: 0, y: 0 }, action: { x: 0, y: 0 }, useSkill: false };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000005);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(50, 100, 50); scene.add(sun);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshPhongMaterial({ color: 0x111111 }));
        floor.rotation.x = -Math.PI / 2; scene.add(floor);

        // Buildings
        const gridSize = 40, range = 240;
        for(let x = -range; x <= range; x += gridSize) {
            for(let z = -range; z <= range; z += gridSize) {
                if (Math.abs(x) < 25 && Math.abs(z) < 25) continue;
                const h = 15 + Math.random() * 35, w = 10 + Math.random() * 5;
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), new THREE.MeshPhongMaterial({ color: [0xff4444, 0x44ff44, 0x4444ff, 0xffff44, 0xff44ff, 0x44ffff][Math.floor(Math.random()*6)] }));
                mesh.position.set(x + (Math.random()-0.5)*25, h/2, z + (Math.random()-0.5)*25);
                scene.add(mesh);
                obstacles.push({ pos: new THREE.Vector2(mesh.position.x, mesh.position.z), radius: (w / 2) + 0.8 });
            }
        }

        // Utils
        function checkBuildingCollision(position, radius) {
            obstacles.forEach(o => {
                const dist = new THREE.Vector2(position.x, position.z).distanceTo(o.pos);
                if (dist < o.radius + radius) {
                    const pushDir = new THREE.Vector2(position.x, position.z).sub(o.pos).normalize();
                    const overlap = (o.radius + radius) - dist;
                    position.x += pushDir.x * overlap; position.z += pushDir.y * overlap;
                }
            });
        }

        function spawnItem() {
            const type = Math.random() > 0.5 ? 'hp' : 'shield';
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(1.0), new THREE.MeshPhongMaterial({ color: type === 'hp' ? 0x00ff00 : 0x00aaff, emissive: type === 'hp' ? 0x00ff00 : 0x00aaff }));
            let tx, tz, ok = false;
            while(!ok) {
                const ang = Math.random()*Math.PI*2, dist = Math.random()*areaRadius;
                tx = Math.cos(ang)*dist; tz = Math.sin(ang)*dist;
                if (!obstacles.some(o => new THREE.Vector2(tx, tz).distanceTo(o.pos) < o.radius+2)) ok = true;
            }
            mesh.position.set(tx, 1.0, tz); scene.add(mesh); items.push({ mesh, type });
        }
        function dropSkillCard(pos) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 1.8), new THREE.MeshPhongMaterial({ color: 0x00ffff, emissive: 0x006666 }));
            mesh.position.set(pos.x, 0.5, pos.z); scene.add(mesh); items.push({ mesh, type: 'card' });
        }
        for(let i=0; i<15; i++) spawnItem();

        const areaWall = new THREE.Mesh(new THREE.CylinderGeometry(areaRadius, areaRadius, 150, 64, 1, true), new THREE.MeshBasicMaterial({ color: 0x8800ff, transparent: true, opacity: 0.3, side: THREE.DoubleSide }));
        areaWall.position.y = 75; scene.add(areaWall);

        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        pBody.position.y = 0.75; player.add(pBody);
        const pStand = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xff0000, transparent: true, opacity: 0.8, emissive: 0x440000 }));
        pStand.visible = false; scene.add(pStand); 
        scene.add(player); player.add(camera);
        camera.position.copy(P_CAMERA_BASE_POS); camera.lookAt(0, 0, -5);

        function createEntity() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: [0xffff00, 0x00ffff, 0xff00ff, 0xff8800][Math.floor(Math.random()*4)] }));
            body.position.y = 0.75; group.add(body);
            const stand = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x440000 }));
            stand.visible = false; scene.add(stand);
            let tx, tz, spawned = false;
            while(!spawned) {
                const ang = Math.random()*Math.PI*2, dist = 50 + Math.random()*150;
                tx = Math.cos(ang)*dist; tz = Math.sin(ang)*dist;
                if (!obstacles.some(o => new THREE.Vector2(tx, tz).distanceTo(o.pos) < o.radius+4)) spawned = true;
            }
            group.position.set(tx, 0, tz); scene.add(group);
            return { group, stand, hp: 200, alive: true, id: Math.random(), attackCd: 0, aiState: 'idle', stateTimer: 0, strafeDir: Math.random() > 0.5 ? 1 : -1, target: null, killedByPlayer: false };
        }
        for(let i=0; i<39; i++) entities.push(createEntity());

        // Interface functions
        window.setMode = (m) => {
            inputMode = m;
            document.getElementById('mode-pc').classList.toggle('active', m === 'pc');
            document.getElementById('mode-mobile').classList.toggle('active', m === 'mobile');
        };

        window.startGame = (type) => {
            if (type === 'white') charStats = { speed: 25, attack: 18, color: 0xffffff, type };
            if (type === 'cyan') charStats = { speed: 32, attack: 14, color: 0x00ffff, type };
            if (type === 'gold') charStats = { speed: 20, attack: 28, color: 0xffd700, type };
            pBody.material.color.setHex(charStats.color);
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block';
            if(inputMode === 'mobile') document.getElementById('mobile-controls').style.display = 'block';
            isGameStarted = true;
        };

        document.getElementById('victory-message').onclick = () => location.reload();
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // Joystick Logic
        const setupJoystick = (id, knobId, dataKey) => {
            const stick = document.getElementById(id);
            const knob = document.getElementById(knobId);
            const rect = stick.getBoundingClientRect();
            const center = { x: rect.left + 60, y: rect.top + 60 };

            const handleTouch = (e) => {
                const touch = Array.from(e.touches).find(t => 
                    Math.hypot(t.clientX - center.x, t.clientY - center.y) < 100
                );
                if (!touch) {
                    knob.style.transform = `translate(-50%, -50%)`;
                    joystickData[dataKey] = { x: 0, y: 0 };
                    return;
                }
                let dx = touch.clientX - center.x, dy = touch.clientY - center.y;
                const dist = Math.min(Math.hypot(dx, dy), 50);
                const angle = Math.atan2(dy, dx);
                dx = Math.cos(angle) * dist; dy = Math.sin(angle) * dist;
                knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                joystickData[dataKey] = { x: dx / 50, y: dy / 50 };
            };
            stick.addEventListener('touchstart', handleTouch);
            stick.addEventListener('touchmove', handleTouch);
            stick.addEventListener('touchend', () => {
                knob.style.transform = `translate(-50%, -50%)`;
                joystickData[dataKey] = { x: 0, y: 0 };
            });
        };
        setupJoystick('move-stick', 'move-knob', 'move');
        setupJoystick('action-stick', 'action-knob', 'action');
        document.getElementById('skill-btn').addEventListener('touchstart', () => joystickData.useSkill = true);
        document.getElementById('skill-btn').addEventListener('touchend', () => joystickData.useSkill = false);

        let pAttackCd = 0;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            if (!isGameStarted || isGameOver) return;

            const isEvolved = collectedCards >= 7;
            let maxUses = (charStats.type === 'cyan') ? (isEvolved ? 4 : 2) : (isEvolved ? 3 : 1);

            const skillLabel = document.getElementById('skill-ui');
            if (skillCd > 0) { skillLabel.innerText = "SKILL ACTIVE..."; skillLabel.style.color = "#f0f"; }
            else if (skillUses >= maxUses) { skillLabel.innerText = "SKILL DEPLETED"; skillLabel.style.color = "#f00"; }
            else if (collectedCards < 3) { skillLabel.innerText = `CARDS: ${collectedCards} / 3 (LOCKED)`; skillLabel.style.color = "#888"; }
            else {
                const levelText = isEvolved ? "MAX EVOLVED" : "READY";
                skillLabel.innerText = `${levelText} [R] (${skillUses}/${maxUses})`; skillLabel.style.color = isEvolved ? "#0ff" : "#ff0";
            }

            // Input Handling
            const pSpeed = charStats.speed * delta;
            let moveX = 0, moveZ = 0, rotY = 0, wantAttack = false, wantSkill = false;

            if (inputMode === 'pc') {
                if (keys['ArrowLeft']) rotY = 3.6 * delta;
                if (keys['ArrowRight']) rotY = -3.6 * delta;
                moveX = (keys['KeyD']?1:0) - (keys['KeyA']?1:0);
                moveZ = (keys['KeyS']?1:0) - (keys['KeyW']?1:0);
                wantAttack = keys['Space'];
                wantSkill = keys['KeyR'];
            } else {
                rotY = -joystickData.action.x * 4.0 * delta;
                moveX = joystickData.move.x;
                moveZ = joystickData.move.y;
                wantAttack = Math.abs(joystickData.action.x) > 0.5 || Math.abs(joystickData.action.y) > 0.5;
                wantSkill = joystickData.useSkill;
            }

            player.rotation.y += rotY;
            if (moveX !== 0 || moveZ !== 0) {
                const moveVec = new THREE.Vector3(moveX, 0, moveZ).normalize().multiplyScalar(pSpeed).applyQuaternion(player.quaternion);
                player.position.add(moveVec);
            }
            checkBuildingCollision(player.position, 0.8);

            // Skill Activation
            if (wantSkill && skillCd <= 0 && collectedCards >= 3 && skillUses < maxUses) {
                skillUses++;
                const dur = charStats.type === 'white' ? (isEvolved ? 7000 : 5000) : charStats.type === 'cyan' ? (isEvolved ? 6500 : 3500) : (isEvolved ? 5000 : 3000);
                skillCd = dur / 1000;
                if (charStats.type === 'white') { isInvincible = true; pBody.material.emissive.setHex(0xffffff); setTimeout(() => { isInvincible = false; pBody.material.emissive.setHex(0x000000); skillCd = 0; }, dur); }
                if (charStats.type === 'cyan') { isTimeSkipping = true; document.getElementById('time-skip-overlay').style.display = 'block'; setTimeout(() => { isTimeSkipping = false; document.getElementById('time-skip-overlay').style.display = 'none'; skillCd = 0; }, dur); }
                if (charStats.type === 'gold') { isTimeStopped = true; document.body.classList.add('time-stopped'); setTimeout(() => { isTimeStopped = false; document.body.classList.remove('time-stopped'); skillCd = 0; }, dur); }
            }

            // Attack Logic
            pAttackCd -= delta;
            if (wantAttack && pAttackCd <= 0) { pAttackCd = 0.5; pStand.visible = true; pCameraShakeAmount = 0.8; setTimeout(() => pStand.visible = false, 200); }
            if (pStand.visible) {
                const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
                pStand.position.copy(player.position).add(fwd.multiplyScalar(2.8)); pStand.position.y = 0.75;
                entities.forEach(e => { if (e.alive && e.group.position.distanceTo(pStand.position) < 3.0) { e.hp -= charStats.attack * delta * 5; if (e.hp <= 0) e.killedByPlayer = true; } });
            }

            // Camera Shake
            if (pCameraShakeAmount > 0) {
                camera.position.x = P_CAMERA_BASE_POS.x + (Math.random()-0.5)*pCameraShakeAmount;
                camera.position.y = P_CAMERA_BASE_POS.y + (Math.random()-0.5)*pCameraShakeAmount;
                pCameraShakeAmount -= delta * 3.0;
            } else camera.position.copy(P_CAMERA_BASE_POS);

            // AI & Area
            const botDelta = isTimeStopped ? 0 : (isTimeSkipping ? delta * 0.3 : delta);
            areaRadius -= botDelta * 0.75;
            areaWall.geometry.dispose(); areaWall.geometry = new THREE.CylinderGeometry(areaRadius, areaRadius, 150, 64, 1, true);

            entities.forEach(e => {
                if (!e.alive || isTimeStopped) { e.stand.visible = false; return; }
                let curTarget = isTimeSkipping ? null : player;
                let minDist = isTimeSkipping ? Infinity : e.group.position.distanceTo(player.position);
                entities.forEach(other => { if (other.alive && other.id !== e.id) { const d = e.group.position.distanceTo(other.group.position); if (d < minDist) { minDist = d; curTarget = other.group; } } });
                e.target = curTarget;
                
                let moveDir = new THREE.Vector3();
                if (e.target) {
                    const toVec = new THREE.Vector3().subVectors(e.target.position, e.group.position).normalize();
                    e.stateTimer -= botDelta;
                    if (e.stateTimer <= 0) {
                        const r = Math.random();
                        if (minDist > 12) e.aiState = 'rush'; else if (r < 0.4) e.aiState = 'strafe'; else if (r < 0.7) e.aiState = 'retreat'; else e.aiState = 'rush';
                        e.stateTimer = 1.0 + Math.random() * 2;
                    }
                    if (e.aiState === 'rush') moveDir.copy(toVec); else if (e.aiState === 'retreat') moveDir.copy(toVec).negate(); else moveDir.set(-toVec.z, 0, toVec.x).multiplyScalar(e.strafeDir);
                    
                    e.attackCd -= botDelta;
                    if (minDist < 6.5 && e.attackCd <= 0) { e.attackCd = 1.5; e.stand.visible = true; setTimeout(() => { if (e.stand) e.stand.visible = false; }, 400); }
                    if (e.stand.visible) {
                        e.stand.position.copy(e.group.position).lerp(e.target.position, 0.5).y = 0.75;
                        if (!isTimeSkipping && e.stand.position.distanceTo(player.position) < 2.5 && !isInvincible) { 
                            const dmg = charStats.attack * botDelta * 4;
                            if (playerShield > 0) playerShield -= dmg; else playerHP -= dmg; 
                        }
                        entities.forEach(v => { if (v.alive && v.id !== e.id && e.stand.position.distanceTo(v.group.position) < 2.5) v.hp -= charStats.attack * botDelta * 3; });
                    }
                }
                e.group.position.add(moveDir.multiplyScalar(14 * botDelta));
                checkBuildingCollision(e.group.position, 0.8);
                if (e.group.position.length() > areaRadius) e.hp -= botDelta * 35;
                if (e.hp <= 0) { e.alive = false; if (e.killedByPlayer) dropSkillCard(e.group.position); scene.remove(e.group); scene.remove(e.stand); }
            });

            // Items
            items.forEach((it, idx) => { 
                if (player.position.distanceTo(it.mesh.position) < 2.5) { 
                    if (it.type === 'hp') playerHP = Math.min(100, playerHP + 40); else if (it.type === 'shield') playerShield = Math.min(100, playerShield + 60); else if (it.type === 'card') collectedCards++;
                    scene.remove(it.mesh); items.splice(idx, 1); if (it.type !== 'card') setTimeout(spawnItem, 8000); 
                } 
            });

            // System
            if (player.position.length() > areaRadius) playerHP -= delta * 25;
            const survivorCount = entities.filter(e => e.alive).length + 1;
            document.getElementById('hp-fill').style.width = Math.max(0, playerHP) + "%";
            document.getElementById('shield-fill').style.width = playerShield + "%";
            document.getElementById('survivors-count').innerText = survivorCount;
            document.getElementById('area-radius').innerText = Math.floor(areaRadius);
            document.getElementById('warning').style.display = (player.position.length() > areaRadius) ? 'block' : 'none';

            if (survivorCount === 1 && playerHP > 0) { isGameOver = true; document.getElementById('victory-message').style.display = 'block'; }
            if (playerHP <= 0 && !isGameOver) {
                isGameOver = true; document.getElementById('final-rank').innerText = survivorCount; document.getElementById('gameover-screen').style.display = 'flex'; document.getElementById('ui-container').style.display = 'none'; document.getElementById('mobile-controls').style.display = 'none';
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
