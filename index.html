<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TOFU SURVIVOR: THE COMPLETE EDITION</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', sans-serif; user-select: none; transition: filter 0.3s; }
        .time-stopped { filter: invert(100%) hue-rotate(180deg); }
        #time-skip-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 0, 0, 0.3); pointer-events: none; z-index: 50; display: none; }
        .full-screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; }
        #start-screen { background: rgba(0, 0, 30, 0.95); color: white; }
        .char-container { display: flex; gap: 20px; margin-top: 30px; }
        .char-card { border: 3px solid #444; padding: 20px; border-radius: 15px; cursor: pointer; transition: 0.3s; background: #111; width: 160px; }
        .char-card:hover { border-color: #f0f; transform: translateY(-10px); box-shadow: 0 0 20px #f0f; }
        #gameover-screen { background: rgba(50, 0, 0, 0.9); color: #ff0044; display: none; z-index: 200; cursor: pointer; }
        .retire-text { font-size: 80px; font-weight: bold; text-shadow: 0 0 20px #000; margin: 0; }
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; }
        #area-ui { position: absolute; top: 20px; right: 20px; color: #f0f; background: rgba(0,0,0,0.8); padding: 15px; border: 2px solid #f0f; border-radius: 10px; font-weight: bold; text-align: right; }
        #status-ui { position: absolute; bottom: 30px; left: 30px; color: #fff; text-shadow: 2px 2px #000; }
        .bar-container { width: 250px; height: 12px; background: #222; border: 1.5px solid #fff; margin-bottom: 8px; overflow: hidden; border-radius: 3px; }
        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #0a0, #0f0); transition: width 0.2s; }
        #shield-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #0055ff, #00aaff); transition: width 0.2s; }
        #skill-ui { color: #ff0; font-weight: bold; font-size: 18px; margin-bottom: 10px; text-transform: uppercase; }
        #warning { position: absolute; top: 35%; left: 50%; transform: translateX(-50%); color: #ff0044; font-size: 48px; font-weight: bold; display: none; }
        #victory-message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 64px; font-weight: bold; text-shadow: 0 0 20px #f0f; display: none; z-index: 200; text-align: center; }
    </style>
</head>
<body>
    <div id="time-skip-overlay"></div>
    <div id="victory-message">Champion of 100 Survivors !!<br><span style="font-size: 24px; color: #ccc;">(Click to Restart)</span></div>
    <div id="gameover-screen" class="full-screen-overlay" onclick="location.reload()">
        <p class="retire-text">RETIRE</p>
        <p class="rank-text" style="font-size:32px; color:#fff;">RANK: <span id="final-rank">0</span> / 100</p>
    </div>
    <div id="start-screen" class="full-screen-overlay">
        <h1 style="font-size: 48px; color: #f0f;">TOFU SURVIVOR 100: COMPLETE</h1>
        <div class="char-container">
            <div class="char-card" onclick="startGame('white')"><h3 style="color:#fff">WHITE</h3><p>無敵化</p></div>
            <div class="char-card" onclick="startGame('cyan')"><h3 style="color:#0ff">CYAN</h3><p>時飛ばし</p></div>
            <div class="char-card" onclick="startGame('gold')"><h3 style="color:#fd0">GOLD</h3><p>時停止</p></div>
        </div>
    </div>
    <div id="ui-container">
        <div id="warning">⚠️ OUT OF AREA ⚠️</div>
        <div id="area-ui">SURVIVORS: <span id="survivors-count">100</span><br>SAFE RADIUS: <span id="area-radius">350</span>m</div>
        <div id="status-ui">
            <div id="skill-ui">CARDS: 0 / 3</div>
            SHIELD <div class="bar-container"><div id="shield-fill"></div></div>
            HP <div class="bar-container"><div id="hp-fill"></div></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        let isGameStarted = false, areaRadius = 350, isGameOver = false;
        let charStats = { speed: 22, attack: 45, color: 0xffffff, type: 'white' };
        let playerHP = 100, playerShield = 0;
        let isInvincible = false, isTimeStopped = false, isTimeSkipping = false;
        let skillCd = 0, collectedCards = 0, skillUses = 0;
        const entities = [], obstacles = [], items = [], particles = [], labels = [], keys = {};
        let pCameraShakeAmount = 0;
        const P_CAMERA_BASE_POS = new THREE.Vector3(0, 15, 20);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000005);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(50, 100, 50); scene.add(sun);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshPhongMaterial({ color: 0x111111 }));
        floor.rotation.x = -Math.PI / 2; scene.add(floor);

        // ビル配置
        for(let x = -450; x <= 450; x += 50) {
            for(let z = -450; z <= 450; z += 50) {
                if (Math.abs(x) < 30 && Math.abs(z) < 30) continue;
                const h = 20 + Math.random() * 40, w = 15;
                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), new THREE.MeshPhongMaterial({ color: 0x222222 }));
                mesh.position.set(x + (Math.random()-0.5)*20, h/2, z + (Math.random()-0.5)*20);
                scene.add(mesh);
                obstacles.push({ pos: new THREE.Vector2(mesh.position.x, mesh.position.z), radius: w/2 + 1 });
            }
        }

        // VFX系
        function createParticle(pos, color) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshBasicMaterial({ color }));
            mesh.position.copy(pos);
            const vel = new THREE.Vector3((Math.random()-0.5)*0.6, Math.random()*0.6, (Math.random()-0.5)*0.6);
            scene.add(mesh); particles.push({ mesh, vel, life: 1.0 });
        }
        function createDamageLabel(pos, amount) {
            const canvas = document.createElement('canvas'); canvas.width = 128; canvas.height = 64;
            const ctx = canvas.getContext('2d'); ctx.fillStyle = '#ff0'; ctx.font = 'bold 40px Arial'; ctx.textAlign = 'center';
            ctx.fillText(Math.floor(amount), 64, 45);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
            sprite.position.copy(pos).y += 3; sprite.scale.set(2.5, 1.25, 1);
            scene.add(sprite); labels.push({ sprite, life: 1.0 });
        }
        function dropSkillCard(pos) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.1, 2.2), new THREE.MeshPhongMaterial({ color: 0x00ffff, emissive: 0x00ffff }));
            mesh.position.set(pos.x, 0.5, pos.z); scene.add(mesh); items.push({ mesh, type: 'card' });
        }

        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        pBody.position.y = 0.75; player.add(pBody);
        const pStand = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xff0000, transparent: true, opacity: 0.6 }));
        pStand.visible = false; scene.add(pStand); 
        scene.add(player); player.add(camera);
        camera.position.copy(P_CAMERA_BASE_POS); camera.lookAt(0, 0, -5);

        const areaWall = new THREE.Mesh(new THREE.CylinderGeometry(areaRadius, areaRadius, 150, 64, 1, true), new THREE.MeshBasicMaterial({ color: 0x8800ff, transparent: true, opacity: 0.2 }));
        areaWall.position.y = 75; scene.add(areaWall);

        function createEntity() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0x00ff00 }));
            body.position.y = 0.75; group.add(body);
            const stand = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xff0000 }));
            stand.visible = false; scene.add(stand);
            group.position.set((Math.random()-0.5)*600, 0, (Math.random()-0.5)*600);
            scene.add(group);
            return { group, stand, hp: 300, alive: true, id: Math.random(), attackCd: 2, killedByPlayer: false };
        }
        for(let i=0; i<99; i++) entities.push(createEntity());

        window.startGame = (type) => {
            charStats.type = type;
            if(type==='white') charStats.color=0xffffff; if(type==='cyan') charStats.color=0x00ffff; if(type==='gold') charStats.color=0xffd700;
            pBody.material.color.setHex(charStats.color);
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block';
            isGameStarted = true;
        };

        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        let pAttackCd = 0;
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            if (!isGameStarted || isGameOver) return;

            const isEvolved = collectedCards >= 7;
            let maxUses = (charStats.type === 'cyan') ? (isEvolved ? 4 : 2) : (isEvolved ? 3 : 1);
            document.getElementById('skill-ui').innerText = isEvolved ? `★MAX EVOLVED★ ${skillUses}/${maxUses}` : `CARDS: ${collectedCards}/3 | SKILL: ${skillUses}/${maxUses}`;

            // プレイヤー移動
            const pSpeed = charStats.speed * delta;
            if (keys['ArrowLeft']) player.rotation.y += 3.5 * delta;
            if (keys['ArrowRight']) player.rotation.y -= 3.5 * delta;
            const mx = (keys['KeyD']?1:0) - (keys['KeyA']?1:0), mz = (keys['KeyS']?1:0) - (keys['KeyW']?1:0);
            if (mx || mz) {
                const move = new THREE.Vector3(mx, 0, mz).normalize().multiplyScalar(pSpeed).applyQuaternion(player.quaternion);
                player.position.add(move);
            }
            obstacles.forEach(o => {
                const d = new THREE.Vector2(player.position.x, player.position.z).distanceTo(o.pos);
                if(d < o.radius + 0.8) {
                    const push = new THREE.Vector2(player.position.x, player.position.z).sub(o.pos).normalize().multiplyScalar((o.radius+0.8)-d);
                    player.position.x += push.x; player.position.z += push.y;
                }
            });

            // スタンド攻撃と追従
            pAttackCd -= delta;
            if (keys['Space'] && pAttackCd <= 0) { 
                pAttackCd = 0.35; pStand.visible = true; pCameraShakeAmount = 1.0; 
                setTimeout(() => pStand.visible = false, 150); 
            }
            if (pStand.visible) {
                const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);
                pStand.position.copy(player.position).add(fwd.multiplyScalar(2.8));
                pStand.position.y = 0.75;
                entities.forEach(e => {
                    if (e.alive && e.group.position.distanceTo(pStand.position) < 3) {
                        e.hp -= charStats.attack; createDamageLabel(e.group.position, charStats.attack);
                        for(let i=0; i<5; i++) createParticle(e.group.position, 0xff0000);
                        if(e.hp <= 0) e.killedByPlayer = true;
                    }
                });
            }

            // スキル発動
            if (keys['KeyR'] && skillCd <= 0 && collectedCards >= 3 && skillUses < maxUses) {
                skillUses++; skillCd = 5.0;
                if(charStats.type==='gold'){ isTimeStopped=true; document.body.classList.add('time-stopped'); setTimeout(()=>{isTimeStopped=false; document.body.classList.remove('time-stopped'); skillCd=0;}, isEvolved?5000:3000); }
                if(charStats.type==='cyan'){ isTimeSkipping=true; document.getElementById('time-skip-overlay').style.display='block'; setTimeout(()=>{isTimeSkipping=false; document.getElementById('time-skip-overlay').style.display='none'; skillCd=0;}, isEvolved?6000:3500); }
                if(charStats.type==='white'){ isInvincible=true; pBody.material.emissive.setHex(0xffffff); setTimeout(()=>{isInvincible=false; pBody.material.emissive.setHex(0x000000); skillCd=0;}, isEvolved?7000:5000); }
            }

            // カメラシェイク
            if (pCameraShakeAmount > 0) {
                camera.position.set(P_CAMERA_BASE_POS.x + (Math.random()-0.5)*pCameraShakeAmount, P_CAMERA_BASE_POS.y + (Math.random()-0.5)*pCameraShakeAmount, P_CAMERA_BASE_POS.z);
                pCameraShakeAmount -= delta * 4;
            } else camera.position.copy(P_CAMERA_BASE_POS);

            // VFX更新
            for(let i=particles.length-1; i>=0; i--) {
                particles[i].mesh.position.add(particles[i].vel); particles[i].life -= delta*2;
                particles[i].mesh.scale.setScalar(particles[i].life); if(particles[i].life<=0){scene.remove(particles[i].mesh); particles.splice(i,1);}
            }
            for(let i=labels.length-1; i>=0; i--) {
                labels[i].sprite.position.y += delta; labels[i].life -= delta;
                labels[i].sprite.material.opacity = labels[i].life; if(labels[i].life<=0){scene.remove(labels[i].sprite); labels.splice(i,1);}
            }

            // 敵AI & エリア
            const botDelta = isTimeStopped ? 0 : (isTimeSkipping ? delta * 0.2 : delta);
            areaRadius -= botDelta * 0.35; // 5~7分マッチ
            areaWall.geometry.dispose(); areaWall.geometry = new THREE.CylinderGeometry(areaRadius, areaRadius, 150, 64, 1, true);

            entities.forEach(e => {
                if (!e.alive || isTimeStopped) return;
                const dToP = e.group.position.distanceTo(player.position);
                if (dToP < 400) {
                    const toP = new THREE.Vector3().subVectors(player.position, e.group.position).normalize();
                    e.group.position.add(toP.multiplyScalar(11 * botDelta));
                    if (dToP < 6 && e.attackCd <= 0) {
                        e.attackCd = 2.5; e.stand.visible = true; setTimeout(()=>e.stand.visible=false, 300);
                        e.stand.position.copy(e.group.position).lerp(player.position, 0.5);
                        if(e.stand.position.distanceTo(player.position)<2.5 && !isInvincible && !isTimeSkipping) {
                            playerHP -= 10; createDamageLabel(player.position, 10);
                        }
                    }
                }
                e.attackCd -= botDelta;
                if(e.group.position.length() > areaRadius) e.hp -= botDelta * 20;
                if(e.hp <= 0) { e.alive = false; if(e.killedByPlayer) dropSkillCard(e.group.position); scene.remove(e.group); scene.remove(e.stand); }
            });

            // アイテム取得
            items.forEach((it, i) => { if(player.position.distanceTo(it.mesh.position)<2.5){ if(it.type==='card') collectedCards++; scene.remove(it.mesh); items.splice(i,1); } });

            if (player.position.length() > areaRadius) playerHP -= delta * 15;
            const survivors = entities.filter(e => e.alive).length + 1;
            document.getElementById('hp-fill').style.width = playerHP + "%";
            document.getElementById('survivors-count').innerText = survivors;

            if (playerHP <= 0 || survivors === 1) { 
                isGameOver = true; 
                if(survivors===1) document.getElementById('victory-message').style.display='block';
                else { document.getElementById('final-rank').innerText = survivors; document.getElementById('gameover-screen').style.display='flex'; }
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
