<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Jojo Tofu Survivor - Map Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a0022; font-family: 'MS Gothic', sans-serif; }
        #ui { position: absolute; bottom: 20px; left: 20px; color: #ff00ff; text-shadow: 2px 2px #00ffff; font-size: 28px; font-weight: bold; pointer-events: none; }
        #instructions { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.7); padding: 15px; border: 2px solid #ff00ff; border-radius: 10px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="instructions">
        WASD：移動 / 矢印キー：視点操作<br>
        <b>スペースキー：スタンドラッシュ</b>
    </div>
    <div id="ui">TOFU DISTRICT</div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        // --- 基本設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a0022); 
        scene.fog = new THREE.FogExp2(0x1a0022, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 明るめの環境光とスポットライト
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 2);
        sunLight.position.set(10, 20, 10);
        scene.add(sunLight);

        // --- ステージ生成 ---
        const floorGeo = new THREE.PlaneGeometry(300, 300);
        const floorMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 様々な大きさの立方体（ビル）を配置
        function createBuilding(x, z, width, height, depth, color) {
            const geo = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshPhongMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, height / 2, z); // 地面に接するように配置
            scene.add(mesh);
        }

        // マップの自動生成（ランダム配置）
        const colors = [0x442266, 0x224466, 0x333333, 0x552244];
        for (let i = 0; i < 60; i++) {
            const x = Math.random() * 200 - 100;
            const z = Math.random() * 200 - 100;
            
            // プレイヤーの初期地点(0,0)付近には置かない
            if (Math.abs(x) < 10 && Math.abs(z) < 10) continue;

            const w = Math.random() * 8 + 2;
            const h = Math.random() * 25 + 2;
            const d = Math.random() * 8 + 2;
            const col = colors[Math.floor(Math.random() * colors.length)];
            
            createBuilding(x, z, w, h, d, col);
        }

        // 外周の壁
        createBuilding(0, 150, 300, 40, 5, 0x110011);
        createBuilding(0, -150, 300, 40, 5, 0x110011);
        createBuilding(150, 0, 5, 40, 300, 0x110011);
        createBuilding(-150, 0, 5, 40, 300, 0x110011);

        // --- プレイヤー（自分豆腐） ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const playerBody = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1), 
            new THREE.MeshPhongMaterial({ color: 0xffffff })
        );
        playerBody.position.y = 0.5;
        playerGroup.add(playerBody);

        // TPSカメラ
        const cameraOffset = new THREE.Vector3(0, 3, 6); 
        playerGroup.add(camera);
        camera.position.copy(cameraOffset);
        camera.lookAt(new THREE.Vector3(0, 1, -5));

        // スタンド（赤い豆腐）
        const stand = new THREE.Mesh(
            new THREE.BoxGeometry(1.2, 1.2, 1.2), 
            new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x330000 }) 
        );
        stand.position.set(0, 0.6, -2.5);
        stand.visible = false;
        playerGroup.add(stand);

        // --- 入力とアクション ---
        const keys = {};
        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        let isAttacking = false;
        function attack() {
            if(isAttacking) return;
            isAttacking = true;
            stand.visible = true;

            const rushEffect = setInterval(() => {
                stand.position.x = (Math.random() - 0.5) * 0.8;
                stand.position.y = 0.6 + (Math.random() - 0.5) * 0.5;
            }, 30);

            setTimeout(() => {
                clearInterval(rushEffect);
                stand.visible = false;
                stand.position.set(0, 0.6, -2.5);
                isAttacking = false;
            }, 350);
        }

        // --- ループ ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (keys['ArrowLeft']) playerGroup.rotation.y += 2.5 * delta;
            if (keys['ArrowRight']) playerGroup.rotation.y -= 2.5 * delta;

            const moveSpeed = 15 * delta;
            if (keys['KeyW']) playerGroup.translateZ(-moveSpeed);
            if (keys['KeyS']) playerGroup.translateZ(moveSpeed);
            if (keys['KeyA']) playerGroup.translateX(-moveSpeed);
            if (keys['KeyD']) playerGroup.translateX(moveSpeed);

            if (keys['Space']) attack();

            renderer.render(scene, camera);
        }

            animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
