<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Tofu Survivor - Advanced AI Battle Royale</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'MS Gothic', sans-serif; }
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 25, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; text-align: center; }
        .char-container { display: flex; gap: 20px; margin-top: 30px; }
        .char-card { border: 2px solid #555; padding: 20px; border-radius: 10px; cursor: pointer; transition: 0.3s; background: #111; width: 140px; }
        .char-card:hover { border-color: #f0f; transform: translateY(-10px); background: #222; }
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; }
        #area-ui { position: absolute; top: 10px; right: 10px; color: #f0f; background: rgba(0,0,0,0.8); padding: 10px; border: 2px solid #f0f; border-radius: 5px; font-weight: bold; text-align: right; }
        #status-ui { position: absolute; bottom: 20px; left: 20px; color: #fff; text-shadow: 2px 2px #000; }
        .bar-container { width: 220px; height: 12px; background: #333; border: 2px solid #fff; margin-bottom: 5px; overflow: hidden; }
        #hp-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }
        #shield-fill { width: 0%; height: 100%; background: #00aaff; transition: width 0.1s; }
        #warning { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); color: #ff0044; font-size: 40px; font-weight: bold; display: none; }
        #time-stop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: difference; background: white; display: none; z-index: 50; }
        #crimson-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: rgba(255, 0, 0, 0.2); display: none; z-index: 49; }
        #requiem-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-shadow: inset 0 0 100px rgba(255, 215, 0, 0.4); display: none; z-index: 48; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="font-size: 32px; color: #f0f;">ADVANCED AI BATTLE ROYALE</h1>
        <div class="char-container">
            <div class="char-card" onclick="startGame('white')"><h3>WHITE</h3><p>無敵(E)</p></div>
            <div class="char-card" onclick="startGame('cyan')"><h3>CYAN</h3><p>時飛ばし(E)</p></div>
            <div class="char-card" onclick="startGame('gold')"><h3>GOLD</h3><p>時停止(E)</p></div>
        </div>
    </div>

    <div id="time-stop-overlay"></div>
    <div id="crimson-overlay"></div>
    <div id="requiem-overlay"></div>

    <div id="ui-container">
        <div id="warning">⚠️AREA DAMAGE⚠️</div>
        <div id="area-ui">SURVIVORS: <span id="survivors-count">40</span><br>AREA: <span id="area-radius">250</span></div>
        <div id="status-ui">
            SHIELD <div class="bar-container"><div id="shield-fill"></div></div>
            HP <div class="bar-container"><div id="hp-fill"></div></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        let isGameStarted = false, areaRadius = 250;
        let charStats = { speed: 22, attack: 45, color: 0xffffff, type: 'white' };
        let isTimeStopped = false, isErasingTime = false, isRequiem = false, hasCrit = false;
        let timeStopCooldown = 0, attackCooldown = 0, playerHP = 100, playerShield = 0;
        const entities = [], obstacles = [], items = [], keys = {};

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000005);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(50, 100, 50); scene.add(sun);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshPhongMaterial({ color: 0x111111 }));
        floor.rotation.x = -Math.PI / 2; scene.add(floor);

        const areaWall = new THREE.Mesh(new THREE.CylinderGeometry(areaRadius, areaRadius, 120, 64, 1, true), new THREE.MeshBasicMaterial({ color: 0x8800ff, transparent: true, opacity: 0.3, side: THREE.DoubleSide }));
        areaWall.position.y = 60; scene.add(areaWall);

        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        pBody.position.y = 0.75; player.add(pBody);
        const pStand = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.8, 1.8), new THREE.MeshPhongMaterial({ color: 0xff0000 }));
        pStand.position.set(0, 0.8, -2.5); pStand.visible = false; player.add(pStand);
        scene.add(player); player.add(camera); camera.position.set(0, 12, 18); camera.lookAt(0, 0, -5);

        function createEntity() {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffff00 }));
            body.position.y = 0.75; group.add(body);
            const stand = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), new THREE.MeshPhongMaterial({ color: 0xff0000 }));
            stand.position.set(0, 0.8, -2.5); stand.visible = false; group.add(stand);
            const ang = Math.random() * Math.PI * 2, dist = 50 + Math.random() * 180;
            group.position.set(Math.cos(ang)*dist, 0, Math.sin(ang)*dist);
            scene.add(group);
            return { group, stand, hp: 100, alive: true, id: Math.random(), attackCd: 0, facingDir: new THREE.Vector3(0,0,-1), strafeDir: Math.random() > 0.5 ? 1 : -1, strafeTimer: 0 };
        }
        for(let i=0; i<39; i++) entities.push(createEntity());

        function spawnItem() {
            const type = [0x00ff00, 0xff0000, 0x00aaff][Math.floor(Math.random()*3)];
            const mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(0.8), new THREE.MeshPhongMaterial({ color: type, emissive: type }));
            const ang = Math.random() * Math.PI * 2, dist = Math.random() * (areaRadius * 0.8);
            mesh.position.set(Math.cos(ang)*dist, 0.8, Math.sin(ang)*dist);
            scene.add(mesh); items.push({ mesh, type });
        }
        for(let i=0; i<15; i++) spawnItem();

        window.startGame = (type) => {
            if (type === 'white') charStats = { speed: 23, attack: 45, color: 0xffffff, type: 'white' };
            if (type === 'cyan') charStats = { speed: 28, attack: 35, color: 0x00ffff, type: 'cyan' };
            if (type === 'gold') charStats = { speed: 19, attack: 85, color: 0xffd700, type: 'gold' };
            pBody.material.color.setHex(charStats.color);
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block';
            isGameStarted = true;
        };

        window.addEventListener('keydown', (e) => { keys[e.code] = true; });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            if (!isGameStarted) return;

            // クールダウン
            if (timeStopCooldown > 0) timeStopCooldown -= delta;
            if (attackCooldown > 0) attackCooldown -= delta;

            // プレイヤー移動
            const moveSpeed = charStats.speed * delta;
            if (keys['ArrowLeft']) player.rotation.y += 3 * delta;
            if (keys['ArrowRight']) player.rotation.y -= 3 * delta;
            const mx = (keys['KeyD']?1:0) - (keys['KeyA']?1:0), mz = (keys['KeyS']?1:0) - (keys['KeyW']?1:0);
            if (mx !== 0 || mz !== 0) {
                const moveVec = new THREE.Vector3(mx, 0, mz).normalize().multiplyScalar(moveSpeed).applyQuaternion(player.quaternion);
                player.position.add(moveVec);
            }

            // アイテム回収 (プレイヤー)
            items.forEach((it, idx) => {
                if (player.position.distanceTo(it.mesh.position) < 2) {
                    if (it.type === 0x00ff00) playerHP = Math.min(100, playerHP + 30);
                    if (it.type === 0x00aaff) playerShield = Math.min(100, playerShield + 50);
                    scene.remove(it.mesh); items.splice(idx, 1); spawnItem();
                }
            });

            // プレイヤー攻撃
            if (keys['Space'] && attackCooldown <= 0) {
                attackCooldown = 0.7; pStand.visible = true;
                setTimeout(() => pStand.visible = false, 300);
                entities.forEach(e => {
                    const hitPos = player.position.clone().add(new THREE.Vector3(0,0,-3).applyQuaternion(player.quaternion));
                    if (e.alive && e.group.position.distanceTo(hitPos) < 4) e.hp -= charStats.attack;
                });
            }
            if (pStand.visible) pStand.position.set((Math.random()-0.5)*0.5, 0.8, -2.5 + (Math.random()-0.5)*0.5);

            // BOT AI 強化ロジック
            if (!isTimeStopped) {
                areaRadius -= delta * 0.75;
                areaWall.geometry.dispose();
                areaWall.geometry = new THREE.CylinderGeometry(areaRadius, areaRadius, 120, 64, 1, true);

                entities.forEach(e => {
                    if (!e.alive) return;

                    // 1. 環境認識: 最も近いアイテムを探す
                    let closestItem = null, itemDist = 30;
                    items.forEach(it => {
                        const d = e.group.position.distanceTo(it.mesh.position);
                        if (d < itemDist) { itemDist = d; closestItem = it; }
                    });

                    // 2. ターゲット選定: アイテム、プレイヤー、または他のBOT
                    let targetPos = player.position;
                    let minDist = e.group.position.distanceTo(player.position);
                    entities.forEach(other => {
                        if (other.alive && other.id !== e.id) {
                            const d = e.group.position.distanceTo(other.group.position);
                            if (d < minDist) { minDist = d; targetPos = other.group.position; }
                        }
                    });

                    // 3. 行動決定
                    let moveDir = new THREE.Vector3().subVectors(targetPos, e.group.position).normalize();
                    let finalSpeed = 9;

                    if (e.hp < 40 && closestItem) {
                        // ピンチならアイテム優先
                        moveDir = new THREE.Vector3().subVectors(closestItem.mesh.position, e.group.position).normalize();
                        finalSpeed = 12;
                    } else if (e.group.position.length() > areaRadius * 0.8) {
                        // エリア端なら中央へ
                        moveDir = e.group.position.clone().negate().normalize();
                        finalSpeed = 11;
                    } else if (minDist < 8) {
                        // 戦闘中: 回避運動 (Strafing)
                        e.strafeTimer -= delta;
                        if (e.strafeTimer <= 0) { e.strafeDir *= -1; e.strafeTimer = 1 + Math.random(); }
                        const sideVec = new THREE.Vector3(-moveDir.z, 0, moveDir.x).multiplyScalar(e.strafeDir);
                        moveDir.add(sideVec).normalize();
                        
                        // ヒット＆アウェイ: 攻撃後は少し離れる
                        if (e.attackCd > 0.5) moveDir.negate();
                    }

                    // 4. 移動実行
                    e.facingDir.lerp(moveDir, 0.1);
                    e.group.position.add(e.facingDir.clone().multiplyScalar(finalSpeed * delta));
                    e.group.lookAt(e.group.position.x + e.facingDir.x, 0, e.group.position.z + e.facingDir.z);

                    // 5. アイテム回収 (BOT)
                    if (closestItem && itemDist < 2) {
                        e.hp = Math.min(100, e.hp + 40);
                        scene.remove(closestItem.mesh);
                        items.splice(items.indexOf(closestItem), 1);
                        spawnItem();
                    }

                    // 6. 攻撃実行
                    e.attackCd -= delta;
                    if (minDist < 5.5 && e.attackCd <= 0) {
                        e.attackCd = 1.2; e.stand.visible = true;
                        setTimeout(() => e.stand.visible = false, 400);
                        if (e.group.position.distanceTo(player.position) < 3.5) {
                            if (playerShield > 0) playerShield -= 15; else playerHP -= 15;
                        }
                    }
                    if (e.stand.visible) e.stand.position.set((Math.random()-0.5)*0.4, 0.8, -2.5 + (Math.random()-0.5)*0.4);

                    if (e.group.position.length() > areaRadius) e.hp -= delta * 30;
                    if (e.hp <= 0) { e.alive = false; scene.remove(e.group); }
                });
            }

            // ダメージ・UI更新
            if (player.position.length() > areaRadius) playerHP -= delta * 20;
            document.getElementById('warning').style.display = (player.position.length() > areaRadius) ? 'block' : 'none';
            document.getElementById('hp-fill').style.width = Math.max(0, playerHP) + "%";
            document.getElementById('shield-fill').style.width = Math.max(0, playerShield) + "%";
            document.getElementById('survivors-count').innerText = entities.filter(e => e.alive).length + 1;
            document.getElementById('area-radius').innerText = Math.floor(areaRadius);

            if (playerHP <= 0) { alert("LOSE..."); location.reload(); }
            if (entities.filter(e => e.alive).length === 0 && isGameStarted) { alert("WINNER!"); location.reload(); }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
