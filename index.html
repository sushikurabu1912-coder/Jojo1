<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Tofu Survivor - Standard Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'MS Gothic', sans-serif; }
        
        /* スタート画面のスタイル */
        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 10, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: white;
            text-align: center;
        }
        #start-btn {
            padding: 15px 50px;
            font-size: 24px;
            color: white;
            background: #ff0055;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.2s;
        }
        #start-btn:hover { background: #ff4488; transform: scale(1.1); }

        /* UIのスタイル */
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; }
        #area-ui { position: absolute; top: 10px; right: 10px; color: #f0f; background: rgba(0,0,0,0.8); padding: 10px; border: 2px solid #f0f; border-radius: 5px; font-weight: bold; text-align: right; }
        #status-ui { position: absolute; bottom: 20px; left: 20px; color: #fff; text-shadow: 2px 2px #000; }
        .bar-container { width: 220px; height: 14px; background: #333; border: 2px solid #fff; margin-bottom: 8px; }
        #hp-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }
        #timestop-label { color: #ff0; font-size: 18px; font-weight: bold; }
        #time-stop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: difference; background: white; display: none; z-index: 50; }
    </style>
</head>
<body>

    <!-- スタート画面 -->
    <div id="start-screen">
        <h1 style="font-size: 48px; color: #ff0; margin-bottom: 10px;">TOFU SURVIVOR</h1>
        <p style="margin-bottom: 30px;">移動: WASD / 攻撃: SPACE / 時停止: E</p>
        <button id="start-btn">START GAME</button>
    </div>

    <!-- ゲームUI -->
    <div id="time-stop-overlay"></div>
    <div id="ui-container">
        <div id="area-ui">SURVIVORS: <span id="survivors-count">--</span><br>RADIUS: <span id="area-radius">--</span></div>
        <div id="status-ui">
            <div id="timestop-label">TIME STOP: READY (E)</div>
            HP <div class="bar-container"><div id="hp-fill"></div></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        let isGameStarted = false;

        // --- シーン構築 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000011);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(50, 100, 50);
        scene.add(sunLight);

        // 床とビル
        const obstacles = [];
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshPhongMaterial({ color: 0x111111 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        for (let i = 0; i < 60; i++) {
            const w = 15, h = 20 + Math.random() * 40, d = 15;
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshPhongMaterial({ color: Math.random() * 0xffffff }));
            const rx = (Math.random() - 0.5) * 400;
            const rz = (Math.random() - 0.5) * 400;
            if (Math.abs(rx) < 30 && Math.abs(rz) < 30) continue;
            mesh.position.set(rx, h/2, rz);
            scene.add(mesh);
            obstacles.push({ minX: rx - w/2, maxX: rx + w/2, minZ: rz - d/2, maxZ: rz + d/2 });
        }

        // プレイヤー
        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        pBody.position.y = 0.75;
        player.add(pBody);
        scene.add(player);
        player.add(camera);
        camera.position.set(0, 10, 15);
        camera.lookAt(0, 0, -5);

        // ゲーム状態変数
        let playerHP = 100;
        let isTimeStopped = false;
        let timeStopCooldown = 0;
        let areaRadius = 250;
        const enemies = [];
        const keys = {};

        function checkCollision(x, z) {
            for (let b of obstacles) {
                if (x > b.minX - 1 && x < b.maxX + 1 && z > b.minZ - 1 && z < b.maxZ + 1) return true;
            }
            return false;
        }

        function spawnEnemy() {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffff00 }));
            mesh.position.set((Math.random()-0.5)*300, 0.75, (Math.random()-0.5)*300);
            scene.add(mesh);
            enemies.push({ mesh, alive: true, hp: 100 });
        }
        for(let i=0; i<25; i++) spawnEnemy();

        // キー入力
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyE' && timeStopCooldown <= 0 && !isTimeStopped && isGameStarted) {
                isTimeStopped = true;
                document.getElementById('time-stop-overlay').style.display = 'block';
                setTimeout(() => { 
                    isTimeStopped = false; 
                    timeStopCooldown = 15;
                    document.getElementById('time-stop-overlay').style.display = 'none';
                }, 5000);
            }
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // スタートボタン処理
        document.getElementById('start-btn').onclick = () => {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block';
            isGameStarted = true;
        };

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (isGameStarted) {
                if (!isTimeStopped) {
                    if (areaRadius > 20) areaRadius -= delta * 2;
                    if (timeStopCooldown > 0) timeStopCooldown -= delta;

                    // 移動
                    const speed = 20 * delta;
                    if (keys['KeyW']) {
                        const nx = player.position.x - Math.sin(player.rotation.y) * speed;
                        const nz = player.position.z - Math.cos(player.rotation.y) * speed;
                        if (!checkCollision(nx, nz)) { player.position.x = nx; player.position.z = nz; }
                    }
                    if (keys['KeyS']) {
                        const nx = player.position.x + Math.sin(player.rotation.y) * speed;
                        const nz = player.position.z + Math.cos(player.rotation.y) * speed;
                        if (!checkCollision(nx, nz)) { player.position.x = nx; player.position.z = nz; }
                    }
                    if (keys['KeyA']) player.rotation.y += 3 * delta;
                    if (keys['KeyD']) player.rotation.y -= 3 * delta;

                    // 敵の簡易追跡
                    enemies.forEach(e => {
                        if (!e.alive) return;
                        const dirX = player.position.x - e.mesh.position.x;
                        const dirZ = player.position.z - e.mesh.position.z;
                        const dist = Math.sqrt(dirX*dirX + dirZ*dirZ);
                        if (dist > 2) {
                            e.mesh.position.x += (dirX / dist) * 8 * delta;
                            e.mesh.position.z += (dirZ / dist) * 8 * delta;
                        }
                    });
                }

                // UI更新
                document.getElementById('area-radius').innerText = Math.floor(areaRadius);
                document.getElementById('hp-fill').style.width = playerHP + "%";
                document.getElementById('survivors-count').innerText = enemies.filter(e => e.alive).length + 1;
                document.getElementById('timestop-label').innerText = timeStopCooldown > 0 ? `COOLDOWN: ${Math.ceil(timeStopCooldown)}` : "TIME STOP: READY (E)";
            }

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
