<!-- スタイル部分の修正 -->
<style>
    /* ステータスUIを左上に移動 */
    #status-ui { 
        position: absolute; 
        top: 20px; 
        left: 20px; 
        color: #fff; 
        text-shadow: 2px 2px #000; 
        bottom: auto; /* 下位置をリセット */
    }

    /* モバイル専用コントロールの再配置 */
    #mobile-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
    
    /* 左下：移動スティック */
    #move-stick { position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; pointer-events: auto; }
    
    /* 右下：攻撃・スキルボタン */
    .action-group { position: absolute; bottom: 40px; right: 40px; display: flex; flex-direction: column; gap: 20px; pointer-events: none; }
    .mobile-btn { 
        width: 80px; height: 80px; 
        border-radius: 50%; 
        pointer-events: auto; 
        display: flex; justify-content: center; align-items: center; 
        font-weight: bold; font-size: 14px; color: white;
        text-shadow: 0 0 5px #000;
    }
    #attack-btn { background: rgba(255, 0, 0, 0.4); border: 3px solid #f00; box-shadow: 0 0 15px rgba(255,0,0,0.3); }
    #attack-btn:active { background: rgba(255, 0, 0, 0.8); }
    #skill-btn-mobile { background: rgba(255, 255, 0, 0.4); border: 3px solid #ff0; color: #ff0; }
    #skill-btn-mobile:active { background: rgba(255, 255, 0, 0.8); }
</style>

<!-- HTML部分の修正 -->
<div id="mobile-controls">
    <div id="move-stick" class="joystick"><div id="move-knob" class="stick-knob"></div></div>
    <!-- 視点移動用エリア（透明） -->
    <div id="touch-rotate-area" style="position:absolute; top:0; right:0; width:50%; height:100%; pointer-events:auto;"></div>
    
    <div class="action-group">
        <div id="skill-btn-mobile" class="mobile-btn">SKILL</div>
        <div id="attack-btn" class="mobile-btn">ATTACK</div>
    </div>
</div>

<script type="module">
    // --- 既存の変数などは維持 ---
    let touchRotation = { x: 0, lastX: 0, isTouching: false };

    // 視点移動（右画面スワイプ）のロジック
    const rotateArea = document.getElementById('touch-rotate-area');
    rotateArea.addEventListener('touchstart', (e) => {
        touchRotation.isTouching = true;
        touchRotation.lastX = e.touches[0].clientX;
    });
    rotateArea.addEventListener('touchmove', (e) => {
        if (!touchRotation.isTouching) return;
        const deltaX = e.touches[0].clientX - touchRotation.lastX;
        joystickData.action.x = -deltaX * 0.05; // 擬似的にジョイスティック入力へ変換
        touchRotation.lastX = e.touches[0].clientX;
    });
    rotateArea.addEventListener('touchend', () => {
        touchRotation.isTouching = false;
        joystickData.action.x = 0;
    });

    // 攻撃ボタン
    const atkBtn = document.getElementById('attack-btn');
    atkBtn.addEventListener('touchstart', () => { joystickData.isAttacking = true; });
    atkBtn.addEventListener('touchend', () => { joystickData.isAttacking = false; });

    // スキルボタン
    const sklBtn = document.getElementById('skill-btn-mobile');
    sklBtn.addEventListener('touchstart', () => { joystickData.useSkill = true; });
    sklBtn.addEventListener('touchend', () => { joystickData.useSkill = false; });

    // --- animate関数内の入力判定部分 ---
    // wantAttackの判定を更新
    if (inputMode === 'pc') {
        // ...既存PCロジック
    } else {
        rotY = joystickData.action.x; // スワイプ量で回転
        moveX = joystickData.move.x;
        moveZ = joystickData.move.y;
        wantAttack = joystickData.isAttacking;
        wantSkill = joystickData.useSkill;
    }
</script>
