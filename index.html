<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Jojo Tofu Survivor</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a0022; font-family: 'MS Gothic', sans-serif; }
        #ui { position: absolute; bottom: 20px; left: 20px; color: #ff00ff; text-shadow: 2px 2px #00ffff; font-size: 28px; font-weight: bold; }
        #instructions { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.7); padding: 15px; border: 2px solid #ff00ff; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="instructions">
        WASD：移動 / 矢印キー：視点操作<br>
        <b>スペースキー：赤豆腐スタンド攻撃！</b>
    </div>
    <div id="ui">TOFU SURVIVOR</div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        // --- 基本設定 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a0022); 
        scene.fog = new THREE.FogExp2(0x1a0022, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
        scene.add(light);

        // --- ステージ ---
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshPhongMaterial({ color: 0x222222 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // --- プレイヤー（自分豆腐） ---
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const playerBody = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1), 
            new THREE.MeshPhongMaterial({ color: 0xffffff }) // 白豆腐
        );
        playerBody.position.y = 0.5;
        playerGroup.add(playerBody);

        // --- 3人称カメラの設定（プレイヤーの真後ろ・少し上） ---
        const cameraOffset = new THREE.Vector3(0, 2.5, 5); 
        playerGroup.add(camera);
        camera.position.copy(cameraOffset);
        camera.lookAt(new THREE.Vector3(0, 1, -2)); // 少し前方を向く

        // --- スタンド（赤い豆腐） ---
        const stand = new THREE.Mesh(
            new THREE.BoxGeometry(1, 1, 1), 
            new THREE.MeshPhongMaterial({ color: 0xff0000, transparent: true, opacity: 0.8 }) 
        );
        stand.position.set(0, 0.5, -2); // プレイヤーの2ユニット前方
        stand.visible = false;
        playerGroup.add(stand);

        // --- 入力管理 ---
        const keys = {};
        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        // 攻撃アクション
        let isAttacking = false;
        function attack() {
            if(isAttacking) return;
            isAttacking = true;
            stand.visible = true;

            // ラッシュ演出：小刻みに前後左右に震える
            const startTime = Date.now();
            const rushEffect = setInterval(() => {
                stand.position.x = (Math.random() - 0.5) * 0.5;
                stand.position.z = -2 + (Math.random() - 0.5) * 0.5;
            }, 30);

            setTimeout(() => {
                clearInterval(rushEffect);
                stand.visible = false;
                stand.position.set(0, 0.5, -2);
                isAttacking = false;
            }, 300); // 0.3秒間出現
        }

        // --- メインループ ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // 1. 視点・方向転換 (左右矢印)
            if (keys['ArrowLeft']) playerGroup.rotation.y += 2.5 * delta;
            if (keys['ArrowRight']) playerGroup.rotation.y -= 2.5 * delta;

            // 2. 移動 (WASD) - 向いている方向に進む
            const moveSpeed = 12 * delta;
            if (keys['KeyW']) playerGroup.translateZ(-moveSpeed);
            if (keys['KeyS']) playerGroup.translateZ(moveSpeed);
            if (keys['KeyA']) playerGroup.translateX(-moveSpeed);
            if (keys['KeyD']) playerGroup.translateX(moveSpeed);

            // 3. 攻撃 (Space)
            if (keys['Space']) attack();

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
