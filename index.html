<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Tofu Survivor - Crimson 6s</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'MS Gothic', sans-serif; }
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 20, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; text-align: center; }
        .char-container { display: flex; gap: 20px; margin-top: 30px; }
        .char-card { border: 2px solid #555; padding: 20px; border-radius: 10px; cursor: pointer; transition: 0.3s; background: #111; width: 140px; }
        .char-card:hover { border-color: #f0f; transform: translateY(-10px); background: #222; }
        .ability-text { font-weight: bold; font-size: 11px; }

        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; }
        #area-ui { position: absolute; top: 10px; right: 10px; color: #f0f; background: rgba(0,0,0,0.8); padding: 10px; border: 2px solid #f0f; border-radius: 5px; font-weight: bold; text-align: right; }
        #status-ui { position: absolute; bottom: 20px; left: 20px; color: #fff; text-shadow: 2px 2px #000; }
        .bar-container { width: 220px; height: 12px; background: #333; border: 2px solid #fff; margin-bottom: 5px; overflow: hidden; }
        #hp-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }
        #shield-fill { width: 0%; height: 100%; background: #00aaff; transition: width 0.1s; }
        #warning { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); color: #ff0044; font-size: 40px; font-weight: bold; display: none; }
        #time-stop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: difference; background: white; display: none; z-index: 50; }
        #crimson-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: rgba(255, 0, 0, 0.2); display: none; z-index: 49; }
        #requiem-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-shadow: inset 0 0 100px rgba(255, 215, 0, 0.4); display: none; z-index: 48; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="font-size: 40px; color: #f0f; margin: 0;">SELECT CHARACTER</h1>
        <div class="char-container">
            <div class="char-card" onclick="startGame('white')">
                <div style="width:40px; height:40px; background:#fff; border:1px solid #ccc; margin:auto;"></div>
                <h3>WHITE</h3>
                <p>ジョルノ<br><span class="ability-text" style="color:#ff0;">レクイエム(E)<br>5秒間無敵</span></p>
            </div>
            <div class="char-card" onclick="startGame('cyan')">
                <div style="width:40px; height:40px; background:#0ff; margin:auto;"></div>
                <h3>CYAN</h3>
                <p>ディアボロ<br><span class="ability-text" style="color:#0ff;">時飛ばし(E)<br>6秒間無敵</span></p>
            </div>
            <div class="char-card" onclick="startGame('gold')">
                <div style="width:40px; height:40px; background:#ffd700; margin:auto;"></div>
                <h3>GOLD</h3>
                <p>承太郎<br><span class="ability-text" style="color:#ff0;">時間停止(E)</span></p>
            </div>
        </div>
    </div>

    <div id="time-stop-overlay"></div>
    <div id="crimson-overlay"></div>
    <div id="requiem-overlay"></div>
    <div id="ui-container">
        <div id="warning">⚠️AREA DAMAGE⚠️</div>
        <div id="area-ui">SURVIVORS: <span id="survivors-count">--</span><br>RADIUS: <span id="area-radius">--</span></div>
        <div id="status-ui">
            <div id="at-label" style="color:#f00; font-weight:bold; margin-bottom:5px;">ATTACK: READY</div>
            <div id="ts-label" style="color:#ff0; font-weight:bold; margin-bottom:5px;">ABILITY: READY</div>
            SHIELD <div class="bar-container"><div id="shield-fill"></div></div>
            HP <div class="bar-container"><div id="hp-fill"></div></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        let isGameStarted = false;
        let charStats = { speed: 22, attack: 40, color: 0xffffff, type: 'white' };
        let isTimeStopped = false, isErasingTime = false, isRequiem = false, hasCrit = false;
        let timeStopCooldown = 0, attackCooldown = 0, playerHP = 100, playerShield = 0;
        let areaRadius = 250, powerUpTimer = 0;
        const enemies = [], keys = {}, obstacles = [], items = [];

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000005);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
        sun.position.set(50, 100, 50);
        scene.add(sun);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshPhongMaterial({ color: 0x111111 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        for (let i = 0; i < 60; i++) {
            const h = 20 + Math.random() * 40;
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(15, h, 15), new THREE.MeshPhongMaterial({ color: 0x333344 }));
            const rx = (Math.random() - 0.5) * 450;
            const rz = (Math.random() - 0.5) * 450;
            if (Math.abs(rx) < 40 && Math.abs(rz) < 40) continue;
            mesh.position.set(rx, h/2, rz);
            scene.add(mesh);
            obstacles.push({ minX: rx-8.5, maxX: rx+8.5, minZ: rz-8.5, maxZ: rz+8.5 });
        }

        let wallGeom = new THREE.CylinderGeometry(areaRadius, areaRadius, 120, 64, 1, true);
        const areaWall = new THREE.Mesh(wallGeom, new THREE.MeshBasicMaterial({ color: 0x8800ff, transparent: true, opacity: 0.3, side: THREE.DoubleSide }));
        areaWall.position.y = 60;
        scene.add(areaWall);

        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        pBody.position.y = 0.75;
        player.add(pBody);
        scene.add(player);
        player.add(camera);
        camera.position.set(0, 8, 12);
        camera.lookAt(0, 0, -5);

        const stand = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x330000 }));
        stand.visible = false;
        player.add(stand);

        function spawnItem() {
            const types = [0x00ff00, 0xff0000, 0x00aaff];
            const type = types[Math.floor(Math.random() * types.length)];
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshPhongMaterial({ color: type, emissive: type, emissiveIntensity: 0.5 }));
            const ang = Math.random() * Math.PI * 2;
            const dist = Math.random() * (areaRadius - 20);
            mesh.position.set(Math.cos(ang)*dist, 0.6, Math.sin(ang)*dist);
            scene.add(mesh);
            items.push({ mesh, type });
        }

        window.startGame = (type) => {
            if (type === 'white') charStats = { speed: 23, attack: 45, color: 0xffffff, type: 'white' };
            if (type === 'cyan') charStats = { speed: 30, attack: 30, color: 0x00ffff, type: 'cyan' };
            if (type === 'gold') charStats = { speed: 17, attack: 80, color: 0xffd700, type: 'gold' };
            
            pBody.material.color.setHex(charStats.color);
            if (charStats.type === 'gold') stand.material.color.setHex(0xA020F0);
            if (charStats.type === 'cyan') stand.material.color.setHex(0xff0033);
            if (charStats.type === 'white') stand.material.color.setHex(0xffd700);
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block';
            for(let i=0; i<12; i++) spawnItem();
            isGameStarted = true;
        };

        function applyDamage(dmg) {
            if (isRequiem || isErasingTime) return; // GERおよび時飛ばし中は無敵
            if (playerShield > 0) {
                playerShield -= dmg;
                if (playerShield < 0) { playerHP += playerShield; playerShield = 0; }
            } else { playerHP -= dmg; }
        }

        function checkCollision(x, z) {
            for (let b of obstacles) if (x > b.minX && x < b.maxX && z > b.minZ && z < b.maxZ) return true;
            return false;
        }

        function spawnEnemy() {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffff00 }));
            const ang = Math.random() * Math.PI * 2;
            const dist = 150 + Math.random() * 50;
            mesh.position.set(Math.cos(ang)*dist, 0.75, Math.sin(ang)*dist);
            scene.add(mesh);
            enemies.push({ mesh, alive: true, hp: 100, lastDir: new THREE.Vector3() });
        }
        for(let i=0; i<35; i++) spawnEnemy();

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyE' && isGameStarted && timeStopCooldown <= 0) {
                if (charStats.type === 'gold' && !isTimeStopped) {
                    isTimeStopped = true;
                    document.getElementById('time-stop-overlay').style.display = 'block';
                    setTimeout(() => { isTimeStopped = false; timeStopCooldown = 15; document.getElementById('time-stop-overlay').style.display = 'none'; }, 5000);
                }
                if (charStats.type === 'cyan' && !isErasingTime) {
                    isErasingTime = true;
                    pBody.material.transparent = true; pBody.material.opacity = 0.4;
                    document.getElementById('crimson-overlay').style.display = 'block';
                    // 時飛ばし時間を6秒に設定
                    setTimeout(() => { 
                        isErasingTime = false; 
                        hasCrit = true; 
                        pBody.material.opacity = 1.0; 
                        timeStopCooldown = 10; 
                        document.getElementById('crimson-overlay').style.display = 'none'; 
                    }, 6000); 
                }
                if (charStats.type === 'white' && !isRequiem) {
                    isRequiem = true;
                    pBody.material.color.setHex(0xffff00);
                    stand.visible = true;
                    document.getElementById('requiem-overlay').style.display = 'block';
                    setTimeout(() => { isRequiem = false; pBody.material.color.setHex(0xffffff); stand.visible = false; timeStopCooldown = 20; document.getElementById('requiem-overlay').style.display = 'none'; }, 5000);
                }
            }
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            if (!isGameStarted) { renderer.render(scene, camera); return; }

            if (timeStopCooldown > 0 && !isTimeStopped && !isErasingTime && !isRequiem) timeStopCooldown -= delta;
            if (attackCooldown > 0) attackCooldown -= delta;
            if (powerUpTimer > 0) powerUpTimer -= delta;

            const speedMult = (isTimeStopped || isErasingTime || isRequiem) ? 1.3 : 1.0;
            const moveSpeed = charStats.speed * delta * speedMult;
            if (keys['ArrowLeft']) player.rotation.y += 3 * delta;
            if (keys['ArrowRight']) player.rotation.y -= 3 * delta;

            const mx = (keys['KeyD']?1:0) - (keys['KeyA']?1:0);
            const mz = (keys['KeyS']?1:0) - (keys['KeyW']?1:0);
            if (mx !== 0 || mz !== 0) {
                const moveVec = new THREE.Vector3(mx, 0, mz).normalize().multiplyScalar(moveSpeed).applyQuaternion(player.quaternion);
                if (!checkCollision(player.position.x + moveVec.x, player.position.z + moveVec.z)) {
                    player.position.x += moveVec.x; player.position.z += moveVec.z;
                }
            }

            items.forEach((it, idx) => {
                it.mesh.rotation.y += delta * 2;
                if (it.mesh.position.distanceTo(player.position) < 2) {
                    if (it.type === 0x00ff00) playerHP = Math.min(100, playerHP + 20);
                    if (it.type === 0xff0000) powerUpTimer = 10;
                    if (it.type === 0x00aaff) playerShield = Math.min(100, playerShield + 50);
                    scene.remove(it.mesh);
                    items.splice(idx, 1);
                    setTimeout(spawnItem, 7000);
                }
            });

            if (isRequiem || stand.visible) {
                stand.position.set((Math.random()-0.5)*0.5, 0.75+(Math.random()-0.5)*0.5, -2.5-Math.random()*0.3);
            }

            if (keys['Space'] && attackCooldown <= 0) {
                attackCooldown = 1.0;
                if (!isRequiem) stand.visible = true;
                let damage = charStats.attack;
                if (hasCrit) { damage *= 3; hasCrit = false; }
                if (powerUpTimer > 0) damage *= 2;
                if (isRequiem) damage *= 1.5;
                
                let count = 0;
                const rush = setInterval(() => {
                    enemies.forEach(e => {
                        const range = isRequiem ? 8 : 5;
                        if (e.alive && e.mesh.position.distanceTo(player.position.clone().add(new THREE.Vector3(0,0,-3).applyQuaternion(player.quaternion))) < range) e.hp -= damage/15;
                    });
                    if (++count > 15) { if (!isRequiem) stand.visible = false; clearInterval(rush); }
                }, 35);
            }

            if (!isTimeStopped) {
                if (areaRadius > 5) areaRadius -= delta * 1.6;
                areaWall.geometry.dispose();
                areaWall.geometry = new THREE.CylinderGeometry(areaRadius, areaRadius, 120, 64, 1, true);

                enemies.forEach(e => {
                    if (!e.alive) return;
                    if (isErasingTime) {
                        const nx = e.mesh.position.x + e.lastDir.x; const nz = e.mesh.position.z + e.lastDir.z;
                        if (!checkCollision(nx, nz)) { e.mesh.position.x = nx; e.mesh.position.z = nz; }
                    } else {
                        const dir = player.position.clone().sub(e.mesh.position).normalize();
                        e.lastDir.copy(dir.multiplyScalar(10 * delta));
                        const nx = e.mesh.position.x + e.lastDir.x; const nz = e.mesh.position.z + e.lastDir.z;
                        if (!checkCollision(nx, nz)) { e.mesh.position.x = nx; e.mesh.position.z = nz; }
                        if (!isRequiem && e.mesh.position.distanceTo(player.position) < 1.5) applyDamage(delta * 15);
                    }
                    if (e.hp <= 0) { e.alive = false; e.mesh.visible = false; }
                });
            }

            if (player.position.length() > areaRadius) {
                applyDamage(delta * 15);
                document.getElementById('warning').style.display = 'block';
            } else document.getElementById('warning').style.display = 'none';

            document.getElementById('hp-fill').style.width = Math.max(0, playerHP) + "%";
            document.getElementById('shield-fill').style.width = Math.max(0, playerShield) + "%";
            document.getElementById('at-label').innerText = powerUpTimer > 0 ? `POWER UP: ${Math.ceil(powerUpTimer)}` : (attackCooldown > 0 ? `AT CD: ${attackCooldown.toFixed(1)}` : "ATTACK: READY");
            document.getElementById('ts-label').innerText = timeStopCooldown > 0 ? `CD: ${Math.ceil(timeStopCooldown)}` : (isRequiem ? "GER ACTIVE!!" : (isErasingTime ? "ERASING TIME..." : "ABILITY: READY (E)"));
            document.getElementById('area-radius').innerText = Math.floor(areaRadius);
            document.getElementById('survivors-count').innerText = enemies.filter(e => e.alive).length + 1;

            if (playerHP <= 0) { alert("GAME OVER"); location.reload(); }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
