<!DOCTYPE html>

<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>TOFU SURVIVOR: PERFECT CUBE FIX</title>

    <style>

        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', sans-serif; user-select: none; transition: filter 0.3s; }

        .time-stopped { filter: invert(100%) hue-rotate(180deg); }

        #time-skip-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 0, 0, 0.3); pointer-events: none; z-index: 50; display: none; }

        .full-screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; }

        #start-screen { background: rgba(0, 0, 30, 0.95); color: white; }

        .char-container { display: flex; gap: 20px; margin-top: 30px; }

        .char-card { border: 3px solid #444; padding: 20px; border-radius: 15px; cursor: pointer; transition: 0.3s; background: #111; width: 160px; }

        .char-card:hover { border-color: #f0f; transform: translateY(-10px); box-shadow: 0 0 20px #f0f; }

        #gameover-screen { background: rgba(50, 0, 0, 0.9); color: #ff0044; display: none; z-index: 200; cursor: pointer; }

        .retire-text { font-size: 80px; font-weight: bold; text-shadow: 0 0 20px #000; margin: 0; }

        .rank-text { font-size: 32px; color: #fff; margin-top: 20px; }

        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; }

        #area-ui { position: absolute; top: 20px; right: 20px; color: #f0f; background: rgba(0,0,0,0.8); padding: 15px; border: 2px solid #f0f; border-radius: 10px; font-weight: bold; text-align: right; }

        #status-ui { position: absolute; bottom: 30px; left: 30px; color: #fff; text-shadow: 2px 2px #000; }

        .bar-container { width: 250px; height: 15px; background: #222; border: 2px solid #fff; margin-bottom: 8px; overflow: hidden; border-radius: 3px; }

        #hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #0a0, #0f0); transition: width 0.2s; }

        #shield-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #0055ff, #00aaff); transition: width 0.2s; }

        #skill-ui { color: #ff0; font-weight: bold; font-size: 18px; margin-bottom: 10px; text-transform: uppercase; }

        #warning { position: absolute; top: 35%; left: 50%; transform: translateX(-50%); color: #ff0044; font-size: 48px; font-weight: bold; display: none; }

        #victory-message { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 64px; font-weight: bold; text-shadow: 0 0 20px #f0f, 0 0 40px #0ff; display: none; z-index: 200; text-align: center; pointer-events: auto; }

    </style>

</head>

<body>

    <div id="time-skip-overlay"></div>

    <div id="victory-message">You are last survivor !!<br><span style="font-size: 24px; color: #ccc;">(Click to Restart)</span></div>

    <div id="gameover-screen" class="full-screen-overlay" onclick="location.reload()">

        <p class="retire-text">RETIRE</p>

        <p class="rank-text">RANK: <span id="final-rank">0</span> / 40</p>

        <p style="color: #aaa; margin-top: 40px;">Click to Re-Challenge</p>

    </div>

    <div id="start-screen" class="full-screen-overlay">

        <h1 style="font-size: 48px; color: #f0f;">TOFU SURVIVOR</h1>

        <p>とうふ！ラストサバイバー</p>

        <div class="char-container">

            <div class="char-card" onclick="startGame('white')"><h3 style="color:#fff">WHITE</h3><p>無敵化</p></div>

            <div class="char-card" onclick="startGame('cyan')"><h3 style="color:#0ff">CYAN</h3><p>時飛ばし</p></div>

            <div class="char-card" onclick="startGame('gold')"><h3 style="color:#fd0">GOLD</h3><p>時停止</p></div>

        </div>

    </div>

    <div id="ui-container">

        <div id="warning">⚠️ OUT OF AREA ⚠️</div>

        <div id="area-ui">SURVIVORS: <span id="survivors-count">40</span><br>SAFE RADIUS: <span id="area-radius">250</span>m</div>

        <div id="status-ui">

            <div id="skill-ui">CARDS: 0 / 3</div>

            SHIELD <div class="bar-container"><div id="shield-fill"></div></div>

            HP <div class="bar-container"><div id="hp-fill"></div></div>

        </div>

    </div>



    <script type="module">

        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';



        let isGameStarted = false, areaRadius = 250, isGameOver = false;

        let charStats = { speed: 22, attack: 15, color: 0xffffff, type: 'white' };

        let playerHP = 100, playerShield = 0;

        let isInvincible = false, isTimeStopped = false, isTimeSkipping = false;

        let skillCd = 0, collectedCards = 0, skillUses = 0;

        const entities = [], obstacles = [], items = [], keys = {};

        let pCameraShakeAmount = 0;

        const P_CAMERA_BASE_POS = new THREE.Vector3(0, 15, 20);



        const scene = new THREE.Scene();

        scene.background = new THREE.Color(0x000005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

        const renderer = new THREE.WebGLRenderer({ antialias: true });

        renderer.setSize(window.innerWidth, window.innerHeight);

        document.body.appendChild(renderer.domElement);



        scene.add(new THREE.AmbientLight(0xffffff, 0.6));

        const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(50, 100, 50); scene.add(sun);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshPhongMaterial({ color: 0x111111 }));

        floor.rotation.x = -Math.PI / 2; scene.add(floor);



        const gridSize = 40, range = 240;

        for(let x = -range; x <= range; x += gridSize) {

            for(let z = -range; z <= range; z += gridSize) {

                if (Math.abs(x) < 25 && Math.abs(z) < 25) continue;

                const h = 15 + Math.random() * 35, w = 10 + Math.random() * 5;

                const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), new THREE.MeshPhongMaterial({ color: [0xff4444, 0x44ff44, 0x4444ff, 0xffff44, 0xff44ff, 0x44ffff][Math.floor(Math.random()*6)] }));

                mesh.position.set(x + (Math.random()-0.5)*25, h/2, z + (Math.random()-0.5)*25);

                scene.add(mesh);

                obstacles.push({ pos: new THREE.Vector2(mesh.position.x, mesh.position.z), radius: (w / 2) + 0.8 });

            }

        }



        function checkBuildingCollision(position, radius) {

            obstacles.forEach(o => {

                const dist = new THREE.Vector2(position.x, position.z).distanceTo(o.pos);

                if (dist < o.radius + radius) {

                    const pushDir = new THREE.Vector2(position.x, position.z).sub(o.pos).normalize();

                    const overlap = (o.radius + radius) - dist;

                    position.x += pushDir.x * overlap; position.z += pushDir.y * overlap;

                }

            });

        }



        function spawnItem() {

            const type = Math.random() > 0.5 ? 'hp' : 'shield';

            const mesh = new THREE.Mesh(new THREE.SphereGeometry(1.0), new THREE.MeshPhongMaterial({ color: type === 'hp' ? 0x00ff00 : 0x00aaff, emissive: type === 'hp' ? 0x00ff00 : 0x00aaff }));

            let tx, tz, ok = false;

            while(!ok) {

                const ang = Math.random()*Math.PI*2, dist = Math.random()*areaRadius;

                tx = Math.cos(ang)*dist; tz = Math.sin(ang)*dist;

                if (!obstacles.some(o => new THREE.Vector2(tx, tz).distanceTo(o.pos) < o.radius+2)) ok = true;

            }

            mesh.position.set(tx, 1.0, tz); scene.add(mesh); items.push({ mesh, type });

        }

        function dropSkillCard(pos) {

            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.1, 1.8), new THREE.MeshPhongMaterial({ color: 0x00ffff, emissive: 0x006666 }));

            mesh.position.set(pos.x, 0.5, pos.z); scene.add(mesh); items.push({ mesh, type: 'card' });

        }

        for(let i=0; i<15; i++) spawnItem();



        const areaWall = new THREE.Mesh(new THREE.CylinderGeometry(areaRadius, areaRadius, 150, 64, 1, true), new THREE.MeshBasicMaterial({ color: 0x8800ff, transparent: true, opacity: 0.3, side: THREE.DoubleSide }));

        areaWall.position.y = 75; scene.add(areaWall);



        const player = new THREE.Group();

        const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffffff }));

        pBody.position.y = 0.75; player.add(pBody);

        const pStand = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xff0000, transparent: true, opacity: 0.8, emissive: 0x440000 }));

        pStand.visible = false; scene.add(pStand);

        scene.add(player); player.add(camera);

        camera.position.copy(P_CAMERA_BASE_POS); camera.lookAt(0, 0, -5);



        function createEntity() {

            const group = new THREE.Group();

            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: [0xffff00, 0x00ffff, 0xff00ff, 0xff8800][Math.floor(Math.random()*4)] }));

            body.position.y = 0.75; group.add(body);

            // 敵スタンド：本体と同じ1.5の完全な立方体

            const stand = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x440000 }));

            stand.visible = false;

            scene.add(stand);

           

            let tx, tz, spawned = false;

            while(!spawned) {

                const ang = Math.random()*Math.PI*2, dist = 50 + Math.random()*150;

                tx = Math.cos(ang)*dist; tz = Math.sin(ang)*dist;

                if (!obstacles.some(o => new THREE.Vector2(tx, tz).distanceTo(o.pos) < o.radius+4)) spawned = true;

            }

            group.position.set(tx, 0, tz); scene.add(group);

            return { group, stand, hp: 200, alive: true, id: Math.random(), attackCd: 0, aiState: 'idle', stateTimer: 0, strafeDir: Math.random() > 0.5 ? 1 : -1, target: null, killedByPlayer: false };

        }

        for(let i=0; i<39; i++) entities.push(createEntity());



        window.startGame = (type) => {

            if (type === 'white') charStats = { speed: 25, attack: 18, color: 0xffffff, type };

            if (type === 'cyan') charStats = { speed: 32, attack: 14, color: 0x00ffff, type };

            if (type === 'gold') charStats = { speed: 20, attack: 28, color: 0xffd700, type };

            pBody.material.color.setHex(charStats.color);

            document.getElementById('start-screen').style.display = 'none';

            document.getElementById('ui-container').style.display = 'block';

            isGameStarted = true;

        };



        document.getElementById('victory-message').onclick = () => location.reload();

        window.addEventListener('keydown', (e) => keys[e.code] = true);

        window.addEventListener('keyup', (e) => keys[e.code] = false);



        let pAttackCd = 0;

        const clock = new THREE.Clock();



        function animate() {

            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);

            if (!isGameStarted || isGameOver) return;



            const isEvolved = collectedCards >= 7;

            let maxUses = (charStats.type === 'cyan') ? (isEvolved ? 4 : 2) : (isEvolved ? 3 : 1);



            const skillLabel = document.getElementById('skill-ui');

            if (skillCd > 0) {

                skillLabel.innerText = "SKILL ACTIVE..."; skillLabel.style.color = "#f0f";

            } else if (skillUses >= maxUses) {

                skillLabel.innerText = "SKILL DEPLETED"; skillLabel.style.color = "#f00";

            } else if (collectedCards < 3) {

                skillLabel.innerText = `CARDS: ${collectedCards} / 3 (LOCKED)`; skillLabel.style.color = "#888";

            } else {

                const levelText = isEvolved ? "MAX EVOLVED" : "READY";

                skillLabel.innerText = `${levelText} [R] (${skillUses}/${maxUses})`; skillLabel.style.color = isEvolved ? "#0ff" : "#ff0";

            }



            const pSpeed = charStats.speed * delta;

            if (keys['ArrowLeft']) player.rotation.y += 3.6 * delta;

            if (keys['ArrowRight']) player.rotation.y -= 3.6 * delta;

            const mx = (keys['KeyD']?1:0) - (keys['KeyA']?1:0), mz = (keys['KeyS']?1:0) - (keys['KeyW']?1:0);

            if (mx !== 0 || mz !== 0) {

                const moveVec = new THREE.Vector3(mx, 0, mz).normalize().multiplyScalar(pSpeed).applyQuaternion(player.quaternion);

                player.position.add(moveVec);

            }

            checkBuildingCollision(player.position, 0.8);



            if (pCameraShakeAmount > 0) {

                camera.position.x = P_CAMERA_BASE_POS.x + (Math.random() - 0.5) * pCameraShakeAmount;

                camera.position.y = P_CAMERA_BASE_POS.y + (Math.random() - 0.5) * pCameraShakeAmount;

                camera.position.z = P_CAMERA_BASE_POS.z + (Math.random() - 0.5) * (pCameraShakeAmount * 0.2);

                pCameraShakeAmount -= delta * 3.0;

            } else { camera.position.copy(P_CAMERA_BASE_POS); }



            if (keys['KeyR'] && skillCd <= 0 && collectedCards >= 3 && skillUses < maxUses) {

                skillUses++;

                if (charStats.type === 'white') {

                    const dur = isEvolved ? 7000 : 5000;

                    skillCd = dur / 1000; isInvincible = true; pBody.material.emissive.setHex(0xffffff);

                    setTimeout(() => { isInvincible = false; pBody.material.emissive.setHex(0x000000); skillCd = 0; }, dur);

                }

                if (charStats.type === 'cyan') {

                    const dur = isEvolved ? 6500 : 3500;

                    skillCd = dur / 1000; isTimeSkipping = true; document.getElementById('time-skip-overlay').style.display = 'block';

                    setTimeout(() => { isTimeSkipping = false; document.getElementById('time-skip-overlay').style.display = 'none'; skillCd = 0; }, dur);

                }

                if (charStats.type === 'gold') {

                    const dur = isEvolved ? 5000 : 3000;

                    skillCd = dur / 1000; isTimeStopped = true; document.body.classList.add('time-stopped');

                    setTimeout(() => { isTimeStopped = false; document.body.classList.remove('time-stopped'); skillCd = 0; }, dur);

                }

            }



            pAttackCd -= delta;

            if (keys['Space'] && pAttackCd <= 0) {

                pAttackCd = 0.5; pStand.visible = true; pCameraShakeAmount = 0.8; setTimeout(() => pStand.visible = false, 200);

            }

            if (pStand.visible) {

                const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(player.quaternion);

                pStand.position.copy(player.position).add(fwd.multiplyScalar(2.8));

                pStand.position.y = 0.75; // プレイヤーのスタンドも高さを固定

                entities.forEach(e => {

                    if (e.alive && e.group.position.distanceTo(pStand.position) < 3.0) {

                        e.hp -= charStats.attack * delta * 5;

                        if (e.hp <= 0) e.killedByPlayer = true;

                    }

                });

            }



            const botDelta = isTimeStopped ? 0 : (isTimeSkipping ? delta * 0.3 : delta);

            areaRadius -= botDelta * 0.75;

            areaWall.geometry.dispose(); areaWall.geometry = new THREE.CylinderGeometry(areaRadius, areaRadius, 150, 64, 1, true);



            entities.forEach(e => {

                if (!e.alive || isTimeStopped) { e.stand.visible = false; return; }

                let curTarget = isTimeSkipping ? null : player;

                let minDist = isTimeSkipping ? Infinity : e.group.position.distanceTo(player.position);

                entities.forEach(other => { if (other.alive && other.id !== e.id) { const d = e.group.position.distanceTo(other.group.position); if (d < minDist) { minDist = d; curTarget = other.group; } } });

               

                e.target = curTarget;

                let moveDir = new THREE.Vector3();

                if (e.target) {

                    const toVec = new THREE.Vector3().subVectors(e.target.position, e.group.position).normalize();

                    e.stateTimer -= botDelta;

                    if (e.stateTimer <= 0) {

                        const r = Math.random();

                        if (minDist > 12) e.aiState = 'rush'; else if (r < 0.4) e.aiState = 'strafe'; else if (r < 0.7) e.aiState = 'retreat'; else e.aiState = 'rush';

                        e.stateTimer = 1.0 + Math.random() * 2;

                    }

                    if (e.aiState === 'rush') moveDir.copy(toVec); else if (e.aiState === 'retreat') moveDir.copy(toVec).negate(); else moveDir.set(-toVec.z, 0, toVec.x).multiplyScalar(e.strafeDir);

                   

                    e.attackCd -= botDelta;

                    if (minDist < 6.5 && e.attackCd <= 0) {

                        e.attackCd = 1.5; e.stand.visible = true;

                        setTimeout(() => { if (e.stand) e.stand.visible = false; }, 400);

                    }

                   

                    if (e.stand.visible) {

                        const attackPos = new THREE.Vector3().copy(e.group.position).lerp(e.target.position, 0.5);

                        e.stand.position.copy(attackPos);

                        // 強制的に高さ(y)を0.75にして地面に埋まらせない（潰れて見えないようにする）

                        e.stand.position.y = 0.75;

                       

                        if (!isTimeSkipping && e.stand.position.distanceTo(player.position) < 2.5 && !isInvincible) {

                            const dmg = charStats.attack * botDelta * 4;

                            if (playerShield > 0) playerShield -= dmg; else playerHP -= dmg;

                        }

                        entities.forEach(v => {

                            if (v.alive && v.id !== e.id && e.stand.position.distanceTo(v.group.position) < 2.5) {

                                v.hp -= charStats.attack * botDelta * 3;

                            }

                        });

                    }

                }

                e.group.position.add(moveDir.multiplyScalar(14 * botDelta));

                checkBuildingCollision(e.group.position, 0.8);

                if (e.group.position.length() > areaRadius) e.hp -= botDelta * 35;

                if (e.hp <= 0) { e.alive = false; if (e.killedByPlayer) dropSkillCard(e.group.position); scene.remove(e.group); scene.remove(e.stand); }

            });



            items.forEach((it, idx) => {

                if (player.position.distanceTo(it.mesh.position) < 2.5) {

                    if (it.type === 'hp') playerHP = Math.min(100, playerHP + 40); else if (it.type === 'shield') playerShield = Math.min(100, playerShield + 60); else if (it.type === 'card') collectedCards++;

                    scene.remove(it.mesh); items.splice(idx, 1); if (it.type !== 'card') setTimeout(spawnItem, 8000);

                }

            });



            if (player.position.length() > areaRadius) playerHP -= delta * 25;

            const survivorCount = entities.filter(e => e.alive).length + 1;

            document.getElementById('hp-fill').style.width = Math.max(0, playerHP) + "%";

            document.getElementById('shield-fill').style.width = playerShield + "%";

            document.getElementById('survivors-count').innerText = survivorCount;

            document.getElementById('area-radius').innerText = Math.floor(areaRadius);

            document.getElementById('warning').style.display = (player.position.length() > areaRadius) ? 'block' : 'none';



            if (survivorCount === 1 && playerHP > 0) { isGameOver = true; document.getElementById('victory-message').style.display = 'block'; }

            if (playerHP <= 0 && !isGameOver) {

                isGameOver = true; document.getElementById('final-rank').innerText = survivorCount; document.getElementById('gameover-screen').style.display = 'flex'; document.getElementById('ui-container').style.display = 'none';

            }

            renderer.render(scene, camera);

        }

        animate();

    </script>

</body>

</html>
