<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Tofu Survivor - Exclusive Ability</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'MS Gothic', sans-serif; }
        
        /* キャラクター選択画面 */
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 20, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; text-align: center; }
        .char-container { display: flex; gap: 20px; margin-top: 30px; }
        .char-card { border: 2px solid #555; padding: 20px; border-radius: 10px; cursor: pointer; transition: 0.3s; background: #111; width: 130px; }
        .char-card:hover { border-color: #f0f; transform: translateY(-10px); background: #222; }
        .char-card h3 { margin: 10px 0; }
        .char-card p { font-size: 11px; color: #aaa; line-height: 1.4; }
        .ability-text { color: #ff0; font-weight: bold; font-size: 10px; }

        /* ゲームUI */
        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; }
        #area-ui { position: absolute; top: 10px; right: 10px; color: #f0f; background: rgba(0,0,0,0.8); padding: 10px; border: 2px solid #f0f; border-radius: 5px; font-weight: bold; text-align: right; }
        #status-ui { position: absolute; bottom: 20px; left: 20px; color: #fff; text-shadow: 2px 2px #000; }
        .bar-container { width: 220px; height: 14px; background: #333; border: 2px solid #fff; margin-bottom: 8px; }
        #hp-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }
        #warning { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); color: #ff0044; font-size: 40px; font-weight: bold; display: none; text-shadow: 3px 3px #000; }
        #time-stop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: difference; background: white; display: none; z-index: 50; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="font-size: 40px; color: #f0f; margin: 0;">SELECT CHARACTER</h1>
        <div class="char-container">
            <div class="char-card" onclick="startGame('standard')">
                <div style="width:40px; height:40px; background:#fff; margin:auto;"></div>
                <h3>WHITE</h3>
                <p>バランス型<br>速度: 普通<br>攻撃: 普通<br><span style="color:#666;">特殊能力: なし</span></p>
            </div>
            <div class="char-card" onclick="startGame('speed')">
                <div style="width:40px; height:40px; background:#0ff; margin:auto;"></div>
                <h3>CYAN</h3>
                <p>速度特化型<br>速度: 高速<br>攻撃: 低い<br><span style="color:#666;">特殊能力: なし</span></p>
            </div>
            <div class="char-card" onclick="startGame('power')">
                <div style="width:40px; height:40px; background:#ffd700; margin:auto;"></div>
                <h3>GOLD</h3>
                <p>パワー・特殊型<br>速度: 低い<br>攻撃: 高い<br><span class="ability-text">特殊能力: 時間停止(E)</span></p>
            </div>
        </div>
    </div>

    <div id="time-stop-overlay"></div>
    <div id="ui-container">
        <div id="warning">⚠️AREA DAMAGE⚠️</div>
        <div id="area-ui">SURVIVORS: <span id="survivors-count">--</span><br>RADIUS: <span id="area-radius">--</span></div>
        <div id="status-ui">
            <div id="at-label" style="color:#f00; font-weight:bold;">ATTACK: READY (SPACE)</div>
            <div id="ts-label" style="color:#ff0; font-weight:bold; display:none;">TIME STOP: READY (E)</div>
            HP <div class="bar-container"><div id="hp-fill"></div></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        let isGameStarted = false;
        let charStats = { speed: 22, attack: 40, color: 0xffffff, canStop: false };

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000005);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
        sun.position.set(50, 100, 50);
        scene.add(sun);

        const obstacles = [];
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshPhongMaterial({ color: 0x111111 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        for (let i = 0; i < 60; i++) {
            const h = 20 + Math.random() * 40;
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(15, h, 15), new THREE.MeshPhongMaterial({ color: 0x333344 }));
            const rx = (Math.random() - 0.5) * 450;
            const rz = (Math.random() - 0.5) * 450;
            if (Math.abs(rx) < 40 && Math.abs(rz) < 40) continue;
            mesh.position.set(rx, h/2, rz);
            scene.add(mesh);
            obstacles.push({ minX: rx-8.5, maxX: rx+8.5, minZ: rz-8.5, maxZ: rz+8.5 });
        }

        let areaRadius = 250;
        let wallGeom = new THREE.CylinderGeometry(areaRadius, areaRadius, 120, 64, 1, true);
        const wallMat = new THREE.MeshBasicMaterial({ color: 0x8800ff, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
        const areaWall = new THREE.Mesh(wallGeom, wallMat);
        areaWall.position.y = 60;
        scene.add(areaWall);

        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        pBody.position.y = 0.75;
        player.add(pBody);
        scene.add(player);
        player.add(camera);
        camera.position.set(0, 8, 12);
        camera.lookAt(0, 0, -5);

        const stand = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x550000 }));
        stand.visible = false;
        player.add(stand);

        let playerHP = 100, isTimeStopped = false, timeStopCooldown = 0, attackCooldown = 0;
        const enemies = [], keys = {};

        window.startGame = (type) => {
            if (type === 'standard') charStats = { speed: 22, attack: 40, color: 0xffffff, canStop: false };
            if (type === 'speed') charStats = { speed: 32, attack: 25, color: 0x00ffff, canStop: false };
            if (type === 'power') charStats = { speed: 17, attack: 80, color: 0xffd700, canStop: true };
            
            pBody.material.color.setHex(charStats.color);
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block';
            
            // GOLD（canStop持ち）の場合だけ時停止UIを出す
            if (charStats.canStop) {
                document.getElementById('ts-label').style.display = 'block';
            } else {
                document.getElementById('ts-label').style.display = 'none';
            }
            
            isGameStarted = true;
        };

        function checkCollision(x, z) {
            for (let b of obstacles) {
                if (x > b.minX && x < b.maxX && z > b.minZ && z < b.maxZ) return true;
            }
            return false;
        }

        function spawnEnemy() {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffff00 }));
            const ang = Math.random() * Math.PI * 2;
            const dist = 150 + Math.random() * 50;
            mesh.position.set(Math.cos(ang)*dist, 0.75, Math.sin(ang)*dist);
            scene.add(mesh);
            enemies.push({ mesh, alive: true, hp: 100 });
        }
        for(let i=0; i<30; i++) spawnEnemy();

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            
            // 時間停止の実行条件：GOLDであること(canStop)
            if (e.code === 'KeyE' && charStats.canStop && timeStopCooldown <= 0 && !isTimeStopped && isGameStarted) {
                isTimeStopped = true;
                document.getElementById('time-stop-overlay').style.display = 'block';
                setTimeout(() => { 
                    isTimeStopped = false; timeStopCooldown = 15;
                    document.getElementById('time-stop-overlay').style.display = 'none';
                }, 5000);
            }
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            if (!isGameStarted) { renderer.render(scene, camera); return; }

            if (timeStopCooldown > 0 && !isTimeStopped) timeStopCooldown -= delta;
            if (attackCooldown > 0) attackCooldown -= delta;

            const speedMult = isTimeStopped ? 1.2 : 1.0;
            const moveSpeed = charStats.speed * delta * speedMult;
            if (keys['ArrowLeft']) player.rotation.y += 3 * delta;
            if (keys['ArrowRight']) player.rotation.y -= 3 * delta;

            const mx = (keys['KeyD']?1:0) - (keys['KeyA']?1:0);
            const mz = (keys['KeyS']?1:0) - (keys['KeyW']?1:0);
            if (mx !== 0 || mz !== 0) {
                const moveVec = new THREE.Vector3(mx, 0, mz).normalize().multiplyScalar(moveSpeed).applyQuaternion(player.quaternion);
                if (!checkCollision(player.position.x + moveVec.x, player.position.z + moveVec.z)) {
                    player.position.x += moveVec.x;
                    player.position.z += moveVec.z;
                }
            }

            if (keys['Space'] && attackCooldown <= 0) {
                attackCooldown = 1.0;
                stand.visible = true;
                setTimeout(() => stand.visible = false, 500);
                enemies.forEach(e => {
                    if (e.alive && e.mesh.position.distanceTo(player.position) < 6) e.hp -= charStats.attack;
                });
            }

            if (!isTimeStopped) {
                if (areaRadius > 5) areaRadius -= delta * 1.5;
                areaWall.geometry.dispose();
                areaWall.geometry = new THREE.CylinderGeometry(areaRadius, areaRadius, 120, 64, 1, true);

                enemies.forEach(e => {
                    if (!e.alive) return;
                    const dir = player.position.clone().sub(e.mesh.position).normalize();
                    const nextX = e.mesh.position.x + dir.x * 10 * delta;
                    const nextZ = e.mesh.position.z + dir.z * 10 * delta;
                    if (!checkCollision(nextX, nextZ)) {
                        e.mesh.position.x = nextX;
                        e.mesh.position.z = nextZ;
                    }
                    if (e.mesh.position.distanceTo(player.position) < 1.5) playerHP -= delta * 15;
                    if (e.hp <= 0) { e.alive = false; e.mesh.visible = false; }
                });
            }

            if (player.position.length() > areaRadius) {
                playerHP -= delta * 15;
                document.getElementById('warning').style.display = 'block';
            } else {
                document.getElementById('warning').style.display = 'none';
            }

            document.getElementById('hp-fill').style.width = Math.max(0, playerHP) + "%";
            
            // 時停止UIの更新（GOLDの時だけ）
            if (charStats.canStop) {
                document.getElementById('ts-label').innerText = timeStopCooldown > 0 ? `TS CD: ${Math.ceil(timeStopCooldown)}` : "TIME STOP: READY (E)";
            }
            
            document.getElementById('at-label').innerText = attackCooldown > 0 ? `AT CD: ${attackCooldown.toFixed(1)}` : "ATTACK: READY (SPACE)";
            document.getElementById('area-radius').innerText = Math.floor(areaRadius);
            document.getElementById('survivors-count').innerText = enemies.filter(e => e.alive).length + 1;

            if (playerHP <= 0) { alert("GAME OVER"); location.reload(); }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
