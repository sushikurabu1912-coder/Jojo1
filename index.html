<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Tofu Survivor - Epitaph Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'MS Gothic', sans-serif; }
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 20, 0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; text-align: center; }
        .char-container { display: flex; gap: 20px; margin-top: 30px; }
        .char-card { border: 2px solid #555; padding: 20px; border-radius: 10px; cursor: pointer; transition: 0.3s; background: #111; width: 140px; }
        .char-card:hover { border-color: #f0f; transform: translateY(-10px); background: #222; }
        .ability-text { color: #0ff; font-weight: bold; font-size: 11px; }

        #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; }
        #area-ui { position: absolute; top: 10px; right: 10px; color: #f0f; background: rgba(0,0,0,0.8); padding: 10px; border: 2px solid #f0f; border-radius: 5px; font-weight: bold; text-align: right; }
        #status-ui { position: absolute; bottom: 20px; left: 20px; color: #fff; text-shadow: 2px 2px #000; }
        .bar-container { width: 220px; height: 14px; background: #333; border: 2px solid #fff; margin-bottom: 8px; }
        #hp-fill { width: 100%; height: 100%; background: #0f0; transition: width 0.1s; }
        #warning { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); color: #ff0044; font-size: 40px; font-weight: bold; display: none; }
        #time-stop-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: difference; background: white; display: none; z-index: 50; }
        #crimson-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: rgba(255, 0, 0, 0.2); display: none; z-index: 49; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="font-size: 40px; color: #f0f; margin: 0;">SELECT CHARACTER</h1>
        <div class="char-container">
            <div class="char-card" onclick="startGame('standard')">
                <div style="width:40px; height:40px; background:#fff; margin:auto;"></div>
                <h3>WHITE</h3>
                <p>バランス<br><span style="color:#666;">能力なし</span></p>
            </div>
            <div class="char-card" onclick="startGame('speed')">
                <div style="width:40px; height:40px; background:#0ff; margin:auto;"></div>
                <h3>CYAN</h3>
                <p>キング・クリムゾン<br><span class="ability-text">時飛ばし(E)<br>解除後強撃</span></p>
            </div>
            <div class="char-card" onclick="startGame('power')">
                <div style="width:40px; height:40px; background:#ffd700; margin:auto;"></div>
                <h3>GOLD</h3>
                <p>スタープラチナ<br><span style="color:#ff0;">時間停止(E)</span></p>
            </div>
        </div>
    </div>

    <div id="time-stop-overlay"></div>
    <div id="crimson-overlay"></div>
    <div id="ui-container">
        <div id="warning">⚠️AREA DAMAGE⚠️</div>
        <div id="area-ui">SURVIVORS: <span id="survivors-count">--</span><br>RADIUS: <span id="area-radius">--</span></div>
        <div id="status-ui">
            <div id="at-label" style="color:#f00; font-weight:bold;">ATTACK: READY</div>
            <div id="ts-label" style="color:#ff0; font-weight:bold; display:none;">ABILITY: READY</div>
            HP <div class="bar-container"><div id="hp-fill"></div></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

        let isGameStarted = false;
        let charStats = { speed: 22, attack: 40, color: 0xffffff, canStop: false, canErase: false };
        let isTimeStopped = false, isErasingTime = false, hasCrit = false;
        let timeStopCooldown = 0, attackCooldown = 0, playerHP = 100;
        let areaRadius = 250;
        const enemies = [], keys = {}, obstacles = [];

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000005);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.0);
        sun.position.set(50, 100, 50);
        scene.add(sun);

        // 床と障害物
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshPhongMaterial({ color: 0x111111 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        for (let i = 0; i < 60; i++) {
            const h = 20 + Math.random() * 40;
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(15, h, 15), new THREE.MeshPhongMaterial({ color: 0x333344 }));
            const rx = (Math.random() - 0.5) * 450;
            const rz = (Math.random() - 0.5) * 450;
            if (Math.abs(rx) < 40 && Math.abs(rz) < 40) continue;
            mesh.position.set(rx, h/2, rz);
            scene.add(mesh);
            obstacles.push({ minX: rx-8.5, maxX: rx+8.5, minZ: rz-8.5, maxZ: rz+8.5 });
        }

        // エリアの壁
        let wallGeom = new THREE.CylinderGeometry(areaRadius, areaRadius, 120, 64, 1, true);
        const areaWall = new THREE.Mesh(wallGeom, new THREE.MeshBasicMaterial({ color: 0x8800ff, transparent: true, opacity: 0.3, side: THREE.DoubleSide }));
        areaWall.position.y = 60;
        scene.add(areaWall);

        // プレイヤー
        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffffff }));
        pBody.position.y = 0.75;
        player.add(pBody);
        scene.add(player);
        player.add(camera);
        camera.position.set(0, 8, 12);
        camera.lookAt(0, 0, -5);

        const stand = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 1.6), new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x330000 }));
        stand.visible = false;
        player.add(stand);

        window.startGame = (type) => {
            if (type === 'standard') charStats = { speed: 22, attack: 40, color: 0xffffff, canStop: false, canErase: false };
            if (type === 'speed') charStats = { speed: 30, attack: 30, color: 0x00ffff, canStop: false, canErase: true };
            if (type === 'power') charStats = { speed: 17, attack: 80, color: 0xffd700, canStop: true, canErase: false };
            
            pBody.material.color.setHex(charStats.color);
            if (charStats.canStop) { stand.material.color.setHex(0xA020F0); document.getElementById('ts-label').style.display = 'block'; }
            if (charStats.canErase) { stand.material.color.setHex(0xff0033); document.getElementById('ts-label').style.display = 'block'; }
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-container').style.display = 'block';
            isGameStarted = true;
        };

        function checkCollision(x, z) {
            for (let b of obstacles) if (x > b.minX && x < b.maxX && z > b.minZ && z < b.maxZ) return true;
            return false;
        }

        function spawnEnemy() {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshPhongMaterial({ color: 0xffff00 }));
            const ang = Math.random() * Math.PI * 2;
            const dist = 150 + Math.random() * 50;
            mesh.position.set(Math.cos(ang)*dist, 0.75, Math.sin(ang)*dist);
            scene.add(mesh);
            enemies.push({ mesh, alive: true, hp: 100, lastDir: new THREE.Vector3() });
        }
        for(let i=0; i<35; i++) spawnEnemy();

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyE' && isGameStarted && timeStopCooldown <= 0) {
                if (charStats.canStop && !isTimeStopped) {
                    isTimeStopped = true;
                    document.getElementById('time-stop-overlay').style.display = 'block';
                    setTimeout(() => { isTimeStopped = false; timeStopCooldown = 15; document.getElementById('time-stop-overlay').style.display = 'none'; }, 5000);
                }
                if (charStats.canErase && !isErasingTime) {
                    isErasingTime = true;
                    pBody.material.transparent = true; pBody.material.opacity = 0.4;
                    document.getElementById('crimson-overlay').style.display = 'block';
                    setTimeout(() => { 
                        isErasingTime = false; hasCrit = true; pBody.material.opacity = 1.0; 
                        timeStopCooldown = 10; document.getElementById('crimson-overlay').style.display = 'none';
                    }, 3000);
                }
            }
        });
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            if (!isGameStarted) { renderer.render(scene, camera); return; }

            if (timeStopCooldown > 0 && !isTimeStopped && !isErasingTime) timeStopCooldown -= delta;
            if (attackCooldown > 0) attackCooldown -= delta;

            const speedMult = (isTimeStopped || isErasingTime) ? 1.3 : 1.0;
            const moveSpeed = charStats.speed * delta * speedMult;
            if (keys['ArrowLeft']) player.rotation.y += 3 * delta;
            if (keys['ArrowRight']) player.rotation.y -= 3 * delta;

            const mx = (keys['KeyD']?1:0) - (keys['KeyA']?1:0);
            const mz = (keys['KeyS']?1:0) - (keys['KeyW']?1:0);
            if (mx !== 0 || mz !== 0) {
                const moveVec = new THREE.Vector3(mx, 0, mz).normalize().multiplyScalar(moveSpeed).applyQuaternion(player.quaternion);
                if (!checkCollision(player.position.x + moveVec.x, player.position.z + moveVec.z)) {
                    player.position.x += moveVec.x; player.position.z += moveVec.z;
                }
            }

            if (keys['Space'] && attackCooldown <= 0) {
                attackCooldown = 1.0;
                stand.visible = true;
                const damage = hasCrit ? charStats.attack * 3 : charStats.attack;
                if (hasCrit) hasCrit = false;
                
                let count = 0;
                const rush = setInterval(() => {
                    stand.position.set((Math.random()-0.5)*1.5, 0.75+(Math.random()-0.5)*1.5, -2.5-Math.random()*0.5);
                    enemies.forEach(e => {
                        if (e.alive && e.mesh.position.distanceTo(player.position.clone().add(new THREE.Vector3(0,0,-3).applyQuaternion(player.quaternion))) < 5) e.hp -= damage/15;
                    });
                    if (++count > 15) { clearInterval(rush); stand.visible = false; }
                }, 35);
            }

            if (!isTimeStopped) {
                if (areaRadius > 5) areaRadius -= delta * 1.6;
                areaWall.geometry.dispose();
                areaWall.geometry = new THREE.CylinderGeometry(areaRadius, areaRadius, 120, 64, 1, true);

                enemies.forEach(e => {
                    if (!e.alive) return;
                    if (isErasingTime) {
                        const nx = e.mesh.position.x + e.lastDir.x; const nz = e.mesh.position.z + e.lastDir.z;
                        if (!checkCollision(nx, nz)) { e.mesh.position.x = nx; e.mesh.position.z = nz; }
                    } else {
                        const dir = player.position.clone().sub(e.mesh.position).normalize();
                        e.lastDir.copy(dir.multiplyScalar(10 * delta));
                        const nx = e.mesh.position.x + e.lastDir.x; const nz = e.mesh.position.z + e.lastDir.z;
                        if (!checkCollision(nx, nz)) { e.mesh.position.x = nx; e.mesh.position.z = nz; }
                        if (e.mesh.position.distanceTo(player.position) < 1.5) playerHP -= delta * 15;
                    }
                    if (e.hp <= 0) { e.alive = false; e.mesh.visible = false; }
                });
            }

            if (player.position.length() > areaRadius) {
                playerHP -= delta * 15; document.getElementById('warning').style.display = 'block';
            } else document.getElementById('warning').style.display = 'none';

            document.getElementById('hp-fill').style.width = Math.max(0, playerHP) + "%";
            document.getElementById('at-label').innerText = hasCrit ? "CRITICAL READY!" : (attackCooldown > 0 ? `AT CD: ${attackCooldown.toFixed(1)}` : "ATTACK: READY");
            if (charStats.canStop || charStats.canErase) document.getElementById('ts-label').innerText = timeStopCooldown > 0 ? `CD: ${Math.ceil(timeStopCooldown)}` : "ABILITY: READY (E)";
            document.getElementById('area-radius').innerText = Math.floor(areaRadius);
            document.getElementById('survivors-count').innerText = enemies.filter(e => e.alive).length + 1;

            if (playerHP <= 0) { alert("GAME OVER"); location.reload(); }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
